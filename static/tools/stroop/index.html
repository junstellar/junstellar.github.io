<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="글자의 뜻 대신 잉크 색에 반응하는 한국어 스트룹 과제. 정확도, 조건별 반응시간, 간섭량을 확인하세요.">
<meta name="robots" content="noindex">
<style>
:root{--ink:#18221c;--paper:#f4f1e8;--mint:#c9f36a;--orange:#ff6b35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif;line-height:1.65}.shell{min-height:100dvh;display:flex;flex-direction:column}header,footer{width:min(1120px,100%);margin:auto;padding:18px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}header{border-bottom:1px solid #ccd0c8;margin-top:0}a{color:inherit}header a{font-weight:800;text-decoration:none}header span{font-size:12px}main{width:min(900px,100%);margin:0 auto;padding:clamp(24px,5vh,52px) 24px;flex:1}footer{font-size:12px;color:#59665b;border-top:1px solid #ccd0c8;margin-bottom:0}h1{font-size:clamp(34px,6vw,64px);line-height:1.15;letter-spacing:-.055em;margin:12px 0 24px}h2{line-height:1.35;font-size:24px;margin:12px 0}h3{margin:0}.eyebrow{font-size:12px;font-weight:bold;color:#a13b16;letter-spacing:.06em}.lead{font-size:18px;max-width:670px}.muted{color:#556459;font-size:14px}.panel{padding:24px;background:#fffdf7;border:1px solid #ccd0c8;border-radius:12px;margin:20px 0}.example{background:white;border:1px solid #ccd0c8;border-radius:8px;padding:16px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}.example strong{font-size:36px;color:#b82027}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--ink);border-radius:5px;padding:12px 18px;color:var(--ink);background:#fffdf7;touch-action:manipulation}button.primary{color:white;background:var(--ink);box-shadow:4px 4px 0 var(--mint)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a13b16;outline-offset:4px}label{display:block;margin:12px 0}input{width:20px;height:20px;vertical-align:middle}select{padding:10px;max-width:100%;margin:8px 0}.testhead{display:flex;justify-content:space-between;gap:8px;font-size:14px}progress{width:100%;height:8px;accent-color:var(--ink)}.stage{height:clamp(160px,28vh,250px);display:grid;place-items:center;border-radius:12px;background:#fff; border:1px solid #ccd0c8;margin:18px 0;user-select:none}.word{font-weight:800;font-size:clamp(56px,11vw,90px);line-height:1.1}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choices button{min-height:66px;font-weight:bold;background:white;color:var(--ink)}.dot{display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:8px;border:1px solid #777}kbd{font:12px monospace;display:block;color:#58635b}.feedback{min-height:32px;text-align:center;font-size:14px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px;border-radius:10px;border:1px solid #ccd0c8;background:#fffdf7}.stat strong{font:700 38px Georgia,serif;display:block;margin:8px 0}.stat small{display:block;color:#556459}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #d5d8d0;padding:12px 5px}details{margin-top:22px}summary{cursor:pointer;font-weight:bold}.warn{border-left:4px solid var(--orange);padding:12px 18px;background:#fffdf7}.facts{display:flex;gap:24px;flex-wrap:wrap}.facts b{font:700 28px Georgia,serif;margin-right:6px}.facts span{font-size:13px}.tablewrap{overflow-x:auto}noscript{display:block;padding:24px}@media(max-width:600px){.choices{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}.stat strong{font-size:34px}.panel{padding:18px}main{padding:24px 18px}.stage{height:170px}.lead{font-size:16px}header,footer{padding:16px 18px}}
.stat strong small{font:400 14px Arial,'Malgun Gothic',sans-serif;margin-top:6px}

/* 생각별 연구소 공통 화면 구성 */
header,footer{max-width:1180px;width:100%;padding-left:28px;padding-right:28px}header{height:clamp(56px,8vh,78px);align-items:center;padding-top:0;padding-bottom:0}.brand{display:flex;align-items:center;gap:10px;letter-spacing:-.04em}.brandMark{display:grid;place-items:center;width:31px;height:31px;background:var(--ink);color:var(--mint);border-radius:50%;font:bold 20px Georgia,serif}.researchTag{border:1px solid var(--ink);border-radius:99px;padding:7px 12px}
main{max-width:1040px;width:100%;padding:clamp(24px,4vh,52px) 28px}.eyebrow{color:#d84e1e}.homePage{max-width:none;padding:0;display:flex;flex-direction:column}.hero{position:relative;width:100%;max-width:1180px;margin:auto;padding:clamp(28px,6vh,72px) 28px 28px;flex:1}.hero:after{content:'Aa';position:absolute;right:4%;top:2%;font:italic 280px Georgia,serif;color:transparent;-webkit-text-stroke:1px #18221c18;pointer-events:none;z-index:0}.hero>*{position:relative;z-index:1}.hero .eyebrow{color:var(--ink);font-size:13px;margin-bottom:20px}.hero h1{font-size:clamp(38px,min(6.5vw,9.6vh),90px);line-height:1.02;letter-spacing:-.075em;margin:0 0 24px}.hero h1 em{font-family:Georgia,'Malgun Gothic',serif;font-weight:400;color:var(--orange)}.heroCopy{max-width:580px;color:#435047;font-size:17px;margin:20px 0 24px}.facts{margin-bottom:26px;gap:32px}.facts b{font-size:31px}.facts span{font-size:12px;color:#556459}.facts b{color:var(--ink)}button.primary{border:0;border-radius:3px;padding:17px 22px;box-shadow:5px 5px 0 var(--mint)}button.primary:hover:not(:disabled){transform:translate(-1px,-1px)}.wide{width:100%;display:flex;justify-content:space-between;gap:20px;font-weight:bold}.notice{font-size:11px;color:#747b76;margin:14px 0 0}.researchStrip{background:var(--ink);color:white;display:grid;grid-template-columns:140px 1fr 1fr;gap:30px;padding:28px max(28px,calc((100vw - 1124px)/2))}.researchStrip>span{color:var(--mint);font-size:12px}.researchStrip h2{font-size:26px;margin:0;letter-spacing:-.04em}.researchStrip p{color:#b9c2bc;font-size:14px;line-height:1.7;margin:0}
.setupPage>h1{font-size:clamp(40px,6vw,68px);line-height:1.03;margin:16px 0 32px}.setupGrid{display:grid;grid-template-columns:1.4fr .85fr;gap:60px}.setupForm>label:first-child{margin-top:0}.setupForm select{width:100%;background:#fffdf7;border:1px solid #9aa49e;border-radius:3px;padding:16px;margin:0}.setupForm .muted{font-size:12px;margin:10px 0 18px}.example{border-radius:3px;padding:14px 18px;gap:20px;font-size:13px}.check{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;font-size:13px;line-height:1.65;margin:24px 0}.check input{margin:2px 0;accent-color:var(--ink)}.guide{align-self:stretch;background:var(--ink);border-top:5px solid var(--mint);padding:26px;color:white}.guide h2{font-size:21px;margin:0 0 14px}.guide ul{padding-left:19px;margin:0;color:#b9c2bc;font-size:14px;line-height:1.9}.guide p{font-size:13px;color:#b9c2bc;margin-top:20px}.stage,.panel,.stat{border-radius:3px}.testhead strong{color:#d84e1e}.choices button{border-radius:3px}.resultPage>h1{font-size:clamp(38px,6vw,64px);margin-bottom:32px}.stat strong{font-size:46px}.interpretation{margin:32px 0;border-top:1px solid #bfc5c0;padding-top:24px}.interpretation>h2{font-size:27px;letter-spacing:-.04em}.interpretation p{font-size:14px;color:#435047}.readingGrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:22px 0;background:#fffdf7;padding:22px;border-left:4px solid var(--mint)}.readingGrid h3{font-size:16px}.readingGrid p{margin-bottom:0} 
@media(max-width:700px){.researchTag{display:none}.hero:after{font-size:170px;top:30px;opacity:.6}.hero{padding:32px 20px 24px}.hero h1{font-size:clamp(34px,7.2vw,52px);line-height:1.12}.heroCopy{font-size:15px}.researchStrip{grid-template-columns:1fr;gap:14px;padding:24px 20px}.researchStrip h2{font-size:24px}.setupGrid{grid-template-columns:1fr;gap:28px}.setupPage>h1{font-size:44px}.guide{padding:22px}main{padding:24px 20px}.homePage{padding:0}.readingGrid{grid-template-columns:1fr;gap:18px;padding:18px}.facts{gap:20px}.facts b{font-size:26px}.facts span{font-size:11px}.example{gap:12px}.example strong{font-size:30px}}

<body><div class="shell"><header><a class="brand" href="/lab/?lang=ko"><span class="brandMark">S</span> 생각별 연구소</a><span class="researchTag">스트룹 · 주의와 억제 조절</span></header><main id="app"></main><footer><span>교육용 인지 과제 · 전문 검사 및 진단을 대신하지 않습니다.</span><span><a href="/lab/?lang=ko">생각별 연구소</a> · <a href="/">블로그 홈</a></span></footer></div><noscript>이 테스트는 JavaScript를 켜야 사용할 수 있습니다.</noscript>
<script>
'use strict';
const VERSION='stroop-ko-manual-v1';
const COLORS=[{name:'빨강',hex:'#b82027'},{name:'파랑',hex:'#205dc0'},{name:'초록',hex:'#19743a'},{name:'노랑',hex:'#967000'}];
const LIMIT=4000, MIN_RT=150, MIN_VALID=12;
const app=document.getElementById('app');
let state={screen:'home',phase:'practice',mode:'idle',index:0,deck:[],records:[],practice:[],input:'keyboard',interrupted:0};
let timer=null,raf=null,generation=0,onset=0;
function stop(){clearTimeout(timer);cancelAnimationFrame(raf);generation++;}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function makeDeck(practice=false){const d=[];for(let ink=0;ink<4;ink++){if(practice){d.push({ink,word:ink,condition:'congruent'},{ink,word:(ink+1)%4,condition:'incongruent'});}else{for(let r=0;r<6;r++)d.push({ink,word:ink,condition:'congruent'});for(let word=0;word<4;word++)if(word!==ink)for(let r=0;r<2;r++)d.push({ink,word,condition:'incongruent'});}}return shuffle(d);}
function median(a){if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function summarize(records){const groups={};for(const condition of ['congruent','incongruent']){const a=records.filter(x=>x.condition===condition),valid=a.filter(x=>x.status==='correct'&&x.rtMs>=MIN_RT);groups[condition]={n:a.length,correct:a.filter(x=>x.status==='correct').length,validN:valid.length,medianMs:median(valid.map(x=>x.rtMs)),errorRate:a.length?a.filter(x=>x.status!=='correct').length/a.length:null};}const c=groups.congruent,i=groups.incongruent,correct=records.filter(x=>x.status==='correct').length;const reliable=c.validN>=MIN_VALID&&i.validN>=MIN_VALID;return {n:records.length,correct,accuracy:records.length?100*correct/records.length:null,groups,interferenceMs:reliable?i.medianMs-c.medianMs:null,errorDifferencePp:c.n&&i.n?100*(i.errorRate-c.errorRate):null,reliable};}
function getResult(){return {tool:'stroop',protocolVersion:VERSION,language:'ko',inputMode:state.input,stimulusLimitMs:LIMIT,minRtMs:MIN_RT,interruptions:state.interrupted,summary:summarize(state.records),trials:state.records.map(x=>({...x}))};}
function fmt(x){return x===null?'—':Math.round(x).toLocaleString('ko-KR');}
function setup(){stop();state.screen='setup';state.mode='idle';app.className='setupPage';app.innerHTML=`
<div class="eyebrow">시작 전 확인</div><h1>시작 전에<br>확인해 주세요.</h1>
<div class="setupGrid"><div class="setupForm">
<label for="input"><b>응답 방식 선택</b></label><select id="input"><option value="keyboard">키보드 · 숫자 1 / 2 / 3 / 4</option><option value="touch">터치 · 화면의 색 버튼</option><option value="mouse">마우스 · 화면의 색 버튼</option></select>
<p class="muted">한 번 시작하면 응답 방식은 고정됩니다.</p>
<div class="example"><strong>파랑</strong><span>글자의 뜻은 파랑이지만,<br>잉크 색이므로 정답은 <b>빨강</b>입니다.</span></div>
<label class="check"><input id="consent" type="checkbox"><span>네 가지 색을 구별하고 한국어 색 이름을 읽을 수 있으며, 교육용 참고 결과임을 이해했습니다.</span></label>
<button class="primary wide" id="start" disabled data-action="practice">연습 시작하기 <span>→</span></button></div>
<aside class="guide"><h2>색에만 집중해 주세요</h2><ul><li>글자의 뜻 대신 잉크 색을 고르세요.</li><li>연습 8회 후 본검사 48회를 진행합니다.</li><li>가능한 한 빠르고 정확하게 답하세요.</li><li>한 문항의 제한시간은 4초입니다.</li><li>본검사는 정답 여부를 알려주지 않습니다.</li></ul><p>키보드: 1 빨강 · 2 파랑<br>3 초록 · 4 노랑</p><p>색 구별이나 읽기가 어렵다면 결과 해석에 제한이 있습니다. 편안한 환경에서 진행해 주세요.</p></aside></div>`;
document.getElementById('input').value=matchMedia('(pointer:coarse)').matches?'touch':'keyboard';document.getElementById('consent').onchange=e=>document.getElementById('start').disabled=!e.target.checked;}
function home(){stop();state.screen='home';state.mode='idle';app.className='homePage';app.innerHTML=`
<section class="hero"><div class="eyebrow">● &nbsp; 선택적 주의와 억제 조절을 살펴보는 스트룹 과제</div>
<h1>읽히는 글자보다,<br><em>보이는 색</em>에 집중하세요.</h1>
<p class="heroCopy">글자의 뜻과 잉크 색이 다를 때, 색에만 반응할 수 있나요? 두 조건의 정확도와 반응시간을 비교해 보세요.</p>
<div class="facts"><span><b>8</b>연습 문항</span><span><b>48</b>본검사 문항</span><span><b>3–5</b>분 내외</span></div>
<button class="primary wide" data-action="setup">테스트 시작하기 <span>→</span></button>
<p class="notice">교육용 참고 과제이며 전문 인지검사나 진단을 대신하지 않습니다. 응답은 서버로 전송되지 않습니다.</p></section>
<section class="researchStrip"><span>01 / 과제 소개</span><h2>글자와 색이 다를 때,<br>반응은 어떻게 달라질까요?</h2><p>스트룹 과제는 단어의 뜻과 잉크 색이 일치할 때와 다를 때의 수행 차이를 살펴봅니다. 이번 검사에서는 정답률, 조건별 반응시간, 두 조건의 차이를 기록합니다.</p></section>`;}

function begin(phase){stop();if(phase==='practice'){state.input=document.getElementById('input').value;state.practice=[];state.records=[];state.interrupted=0;}state.phase=phase;state.deck=makeDeck(phase==='practice');state.index=0;state.screen='test';trial();}
function testUI(){app.className='testPage';app.innerHTML=`<div class="testhead"><strong>${state.phase==='practice'?'연습':'본검사'} ${state.index+1} / ${state.deck.length}</strong><span>잉크 색에 반응하세요</span></div><progress value="${state.index}" max="${state.deck.length}" aria-label="진행률"></progress><div class="stage"><span class="word" id="word">+</span></div><div class="choices">${COLORS.map((c,i)=>`<button data-answer="${i}" disabled><span class="dot" style="background:${c.hex}"></span>${c.name}<kbd>${state.input==='keyboard'?`${i+1} 키`:'누르기'}</kbd></button>`).join('')}</div><p class="feedback" id="feedback" aria-live="polite">${state.phase==='practice'?'연습 결과는 최종 성적에 포함하지 않습니다.':'본검사에서는 정답 여부를 표시하지 않습니다.'}</p><p class="muted">${state.input==='keyboard'?'키보드 숫자 1~4로 답하세요.':state.input==='touch'?'손가락으로 버튼을 누르세요.':'마우스로 버튼을 누르세요.'} 제한시간 4초 · 화면을 벗어나면 검사가 일시 정지됩니다.</p><button data-action="pause">일시 정지</button>`;}
function trial(){stop();state.mode='fixation';testUI();const token=generation;timer=setTimeout(()=>{if(token!==generation)return;const q=state.deck[state.index],word=document.getElementById('word');word.style.visibility='hidden';word.textContent=COLORS[q.word].name;word.style.color=COLORS[q.ink].hex;raf=requestAnimationFrame(()=>{if(token!==generation)return;word.style.visibility='visible';onset=performance.now();state.mode='stimulus';document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=false);timer=setTimeout(()=>answer(null,'timeout'),LIMIT);});},500);}
function answer(choice,source){if(state.mode!=='stimulus')return;const elapsed=performance.now()-onset;stop();state.mode='feedback';const q=state.deck[state.index],rtMs=Math.round(elapsed),timeout=choice===null||elapsed>=LIMIT,status=timeout?'timeout':elapsed<MIN_RT?'anticipatory':choice===q.ink?'correct':'wrong';const record={...q,choice:timeout?null:choice,rtMs:timeout?null:rtMs,status,input:source,trial:state.index+1};(state.phase==='practice'?state.practice:state.records).push(record);document.getElementById('word').textContent='';document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);document.getElementById('feedback').textContent=state.phase==='practice'?(status==='correct'?'맞았습니다.':status==='anticipatory'?'너무 빠른 입력입니다. 글자가 나타난 뒤 답하세요.':`${status==='timeout'?'시간이 지났습니다.':'다른 색을 골랐습니다.'} 정답: ${COLORS[q.ink].name}`):'다음 문항을 준비합니다.';const token=generation;timer=setTimeout(()=>{if(token!==generation)return;state.index++;if(state.index===state.deck.length){if(state.phase==='practice')practiceEnd();else results();}else trial();},state.phase==='practice'?1000:350);}
function practiceEnd(){stop();state.mode='idle';state.screen='ready';const n=state.practice.filter(x=>x.status==='correct').length;app.innerHTML=`<div class="eyebrow">연습 완료</div><h1>${n} / 8 정답</h1><p class="lead">본검사는 총 48회입니다. 글자의 뜻을 무시하고 잉크 색에 빠르고 정확하게 반응하세요.</p><p>선택한 응답 방식: ${state.input==='keyboard'?'키보드':state.input==='touch'?'터치':'마우스'}. 본검사에서는 답변을 수정할 수 없고 정답 여부도 표시하지 않습니다.</p>${n<6?'<p class="warn">조작이나 색 구별이 아직 익숙하지 않을 수 있습니다. 연습을 다시 해보세요.</p>':''}<div class="actions"><button class="primary" data-action="main">본검사 시작 →</button><button data-action="home">설정 및 연습 다시 하기</button></div>`;}
function pause(){if(state.screen!=='test'||state.mode==='paused')return;const answered=state.mode==='feedback';stop();if(answered)state.index++;if(state.index>=state.deck.length){state.phase==='practice'?practiceEnd():results();return;}state.mode='paused';state.interrupted++;app.innerHTML='<div class="eyebrow">일시 정지</div><h1>준비되면 이어가세요.</h1><p>응답하지 않은 문항은 기록에서 제외했습니다. 이어갈 때 남은 문항의 순서를 다시 섞습니다.</p><div class="actions"><button class="primary" data-action="resume">이어 하기 →</button><button data-action="home">검사 종료</button></div>';}
function resume(){state.deck=[...state.deck.slice(0,state.index),...shuffle(state.deck.slice(state.index))];trial();}
function results(){stop();app.className='resultPage';state.screen='result';state.mode='idle';const r=getResult(),s=r.summary,c=s.groups.congruent,i=s.groups.incongruent;app.innerHTML=`<div class="eyebrow">검사 결과</div><h1>이번 수행 결과</h1><div class="stats"><div class="stat">정확도 점수<strong>${fmt(s.accuracy)}<small>/ 100</small></strong><small>${s.correct} / ${s.n} 정답 · 정답률을 점수로 표시</small></div><div class="stat">일치 조건<strong>${fmt(c.medianMs)}<small>ms · 중앙값</small></strong><small>유효 정답 ${c.validN} / ${c.n}</small></div><div class="stat">불일치 조건<strong>${fmt(i.medianMs)}<small>ms · 중앙값</small></strong><small>유효 정답 ${i.validN} / ${i.n}</small></div></div><div class="panel"><h2>스트룹 간섭량 ${fmt(s.interferenceMs)} ms</h2><p>${!s.reliable?'조건별 유효 정답이 부족해 간섭량을 계산하지 않았습니다. 조작 방법을 확인하고 다시 시도해 보세요.':s.interferenceMs>0?'이번 시행에서는 글자와 색이 다를 때 반응이 더 느렸습니다.':s.interferenceMs<0?'이번 시행에서는 불일치 조건이 더 빨랐습니다. 이것만으로 주의력이 우수하다고 판단할 수는 없습니다.':'이번 시행에서는 두 조건의 반응시간 중앙값이 같았습니다.'}</p><p class="muted">불일치 중앙값 − 일치 중앙값. 간섭량은 정확도와 함께 보세요. 작은 차이나 한 번의 기록으로 능력을 판정하기 어렵습니다.</p></div><div class="tablewrap"><table><thead><tr><th>조건</th><th>정답</th><th>오류율*</th><th>시간 초과</th></tr></thead><tbody>${[['일치',c,'congruent'],['불일치',i,'incongruent']].map(([label,g,key])=>`<tr><td>${label}</td><td>${g.correct}/${g.n}</td><td>${fmt(g.errorRate*100)}%</td><td>${state.records.filter(x=>x.condition===key&&x.status==='timeout').length}</td></tr>`).join('')}</tbody></table></div><p class="muted">* 오답·시간 초과·150ms 미만 입력 포함. 오류율 차이(불일치 − 일치): ${fmt(s.errorDifferencePp)}%p. 중단 ${state.interrupted}회.</p>${state.records.some(x=>x.status==='anticipatory')||state.interrupted?'<p class="warn">너무 빠른 입력 또는 검사 중단이 있었습니다. 반복 비교 시 이 점을 고려하세요.</p>':''}<p>100점은 모든 문항을 맞혔다는 뜻이며 인구 상위 100%라는 뜻이 아닙니다. 이 버전의 한국어 규준이 없어 IQ·백분위·우수/낮음 분류는 제공하지 않습니다.</p><section class="interpretation"><div class="eyebrow">결과 읽는 법</div><h2>이 기록은 어떻게 봐야 하나요?</h2>
<p>스트룹은 화면의 변화를 보고 바로 누르는 단순 반응속도 과제와 다릅니다. <b>글자의 뜻을 무시하고 색을 판단해 답을 선택</b>하므로, 단순 반응속도 테스트의 참고 범위를 이 결과에 적용할 수 없습니다.</p>
<div class="readingGrid"><div><h3>정확도부터 확인하세요</h3><p>100점은 48문항을 모두 맞혔다는 뜻입니다. 빠르게 눌렀더라도 오류가 많다면 반응시간만으로 수행이 좋았다고 해석하기 어렵습니다.</p></div><div><h3>두 조건의 차이를 보세요</h3><p>간섭량은 불일치 조건에서 추가로 걸린 시간입니다. 양수면 더 느렸다는 뜻이며, 0이나 음수라도 한 번의 기록으로 억제 능력이 우수하다고 판단할 수 없습니다.</p></div></div>
<p>모니터 주사율, 키보드·터치 입력, 기기 상태에 따라 지연이 달라집니다. 반복 측정은 <b>같은 기기와 응답 방식</b>으로 비교하고, 피로·집중 상태와 과제에 익숙해지는 효과도 고려하세요.</p>
<p class="muted">이 한국어 버전에는 연령별 비교 규준이 없습니다. 개인의 변화와 이번 수행을 살펴보는 교육용 참고 기록이며 IQ나 임상 진단 결과가 아닙니다.</p></section><details><summary>계산 기준과 기록</summary><p>정답 중 150ms 이상 응답만 반응시간에 포함하며 각 조건 12개 이상일 때 간섭량을 표시합니다. 본검사 48회, 제한시간 4초, 고정 색 버튼 배치, 조건별 같은 시행 수를 사용합니다. 키보드·터치·마우스 결과는 직접 비교하기 어렵습니다.</p><p>프로토콜: ${VERSION}. 기록 파일에는 자극·응답·반응시간·조건·응답 방식·중단 횟수가 포함됩니다. 다운로드는 기기에만 저장하며 서버로 보내지 않습니다. 추후 표본 수집은 별도 동의를 갖춘 기능으로 추가할 예정입니다.</p><p><a href="https://www.psytoolkit.org/experiment-library/stroop_phone.html" target="_blank" rel="noopener">참고한 과제 설명</a></p></details><div class="actions"><button class="primary" data-action="home">처음으로</button><button data-action="download">내 기록 내려받기 (JSON)</button></div>`;}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='home')home();if(a==='setup')setup();if(a==='practice'&&document.getElementById('consent').checked)begin('practice');if(a==='main')begin('main');if(a==='pause')pause();if(a==='resume')resume();if(a==='download'){const u=URL.createObjectURL(new Blob([JSON.stringify(getResult(),null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=u;link.download='stroop-result.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}});
app.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-answer]');if(!b||b.disabled||!e.isPrimary||e.button!==0)return;if(state.input==='keyboard')return;if(state.input==='touch'&&e.pointerType!=='touch')return;if(state.input==='mouse'&&e.pointerType!=='mouse')return;e.preventDefault();answer(Number(b.dataset.answer),e.pointerType);});
document.addEventListener('keydown',e=>{if(e.repeat||state.screen!=='test'||state.mode!=='stimulus'||state.input!=='keyboard'||e.ctrlKey||e.altKey||e.metaKey)return;if(/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1,'keyboard');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('blur',pause);
home();
</script></body></html>

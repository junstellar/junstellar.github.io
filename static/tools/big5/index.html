<style>

<script>
"use strict";

/* 문항: IPIP 50-item Goldberg Big-Five markers (ipip.ori.org, 퍼블릭 도메인)
   f: E외향 A우호 C성실 S정서안정 O개방 / k: 1=정방향, -1=역방향 */
const ITEMS = [
  {f:"E",k:1, t:{ko:"모임에서 분위기를 주도하는 사람이다",en:"I am the life of the party",ja:"パーティーの盛り上げ役だ",zh:"我是聚会中的活跃人物"}},
  {f:"E",k:1, t:{ko:"사람들과 함께 있으면 편안하다",en:"I feel comfortable around people",ja:"人と一緒にいると心地よい",zh:"和人在一起时我感到自在"}},
  {f:"E",k:1, t:{ko:"먼저 대화를 시작하는 편이다",en:"I start conversations",ja:"自分から会話を始める",zh:"我会主动开启话题"}},
  {f:"E",k:1, t:{ko:"모임에서 여러 사람과 두루 이야기한다",en:"I talk to a lot of different people at parties",ja:"集まりではいろいろな人と話す",zh:"在聚会上我会和很多不同的人交谈"}},
  {f:"E",k:1, t:{ko:"주목받는 것이 싫지 않다",en:"I don't mind being the center of attention",ja:"注目されるのは嫌ではない",zh:"我不介意成为关注的焦点"}},
  {f:"E",k:-1,t:{ko:"말수가 적은 편이다",en:"I don't talk a lot",ja:"口数が少ない",zh:"我话不多"}},
  {f:"E",k:-1,t:{ko:"나서기보다 뒤에 있는 편이다",en:"I keep in the background",ja:"前に出ず後ろに控えている",zh:"我喜欢待在幕后"}},
  {f:"E",k:-1,t:{ko:"할 말이 별로 없을 때가 많다",en:"I have little to say",ja:"あまり話すことがない",zh:"我常常没什么话可说"}},
  {f:"E",k:-1,t:{ko:"관심이 나에게 쏠리는 것을 좋아하지 않는다",en:"I don't like to draw attention to myself",ja:"自分に注目が集まるのは好きではない",zh:"我不喜欢引人注意"}},
  {f:"E",k:-1,t:{ko:"낯선 사람들 앞에서는 조용해진다",en:"I am quiet around strangers",ja:"初対面の人の前では静かになる",zh:"在陌生人面前我很安静"}},
  {f:"A",k:1, t:{ko:"사람에 대한 관심이 많다",en:"I am interested in people",ja:"人に関心がある",zh:"我对人很感兴趣"}},
  {f:"A",k:1, t:{ko:"다른 사람의 감정에 공감한다",en:"I sympathize with others' feelings",ja:"他人の気持ちに共感する",zh:"我能体谅别人的感受"}},
  {f:"A",k:1, t:{ko:"마음이 여린 편이다",en:"I have a soft heart",ja:"情にもろい",zh:"我心肠软"}},
  {f:"A",k:1, t:{ko:"다른 사람을 위해 기꺼이 시간을 내준다",en:"I take time out for others",ja:"人のために時間を割く",zh:"我愿意为别人抽出时间"}},
  {f:"A",k:1, t:{ko:"다른 사람의 감정이 나에게도 전해진다",en:"I feel others' emotions",ja:"他人の感情が自分にも伝わってくる",zh:"我能感受到别人的情绪"}},
  {f:"A",k:1, t:{ko:"사람들을 편안하게 해주는 편이다",en:"I make people feel at ease",ja:"人を安心させるほうだ",zh:"我能让人感到放松"}},
  {f:"A",k:-1,t:{ko:"다른 사람에게 모욕적인 말을 하곤 한다",en:"I insult people",ja:"人を侮辱することがある",zh:"我有时会说侮辱人的话"}},
  {f:"A",k:-1,t:{ko:"다른 사람의 고민에는 관심이 없다",en:"I am not interested in other people's problems",ja:"他人の悩みには興味がない",zh:"我对别人的问题不感兴趣"}},
  {f:"A",k:-1,t:{ko:"다른 사람 일에 별로 신경 쓰지 않는다",en:"I feel little concern for others",ja:"他人のことはあまり気にかけない",zh:"我不太关心别人"}},
  {f:"A",k:-1,t:{ko:"타인에게 그다지 관심이 없다",en:"I am not really interested in others",ja:"他人にあまり関心がない",zh:"我对他人不太感兴趣"}},
  {f:"C",k:1, t:{ko:"항상 준비가 되어 있다",en:"I am always prepared",ja:"いつも準備ができている",zh:"我总是做好准备"}},
  {f:"C",k:1, t:{ko:"세부 사항까지 꼼꼼히 챙긴다",en:"I pay attention to details",ja:"細部まで気を配る",zh:"我注重细节"}},
  {f:"C",k:1, t:{ko:"해야 할 일은 바로 처리한다",en:"I get chores done right away",ja:"やるべきことはすぐ片付ける",zh:"我会马上把该做的事做完"}},
  {f:"C",k:1, t:{ko:"정돈된 상태를 좋아한다",en:"I like order",ja:"整っているのが好きだ",zh:"我喜欢井井有条"}},
  {f:"C",k:1, t:{ko:"계획표에 따라 움직인다",en:"I follow a schedule",ja:"スケジュール通りに動く",zh:"我按计划行事"}},
  {f:"C",k:1, t:{ko:"일을 빈틈없이 정확하게 한다",en:"I am exacting in my work",ja:"仕事は厳密にこなす",zh:"我做事一丝不苟"}},
  {f:"C",k:-1,t:{ko:"물건을 아무 데나 놓아둔다",en:"I leave my belongings around",ja:"持ち物をあちこちに置きっぱなしにする",zh:"我东西随手乱放"}},
  {f:"C",k:-1,t:{ko:"일을 어질러 놓기 일쑤다",en:"I make a mess of things",ja:"物事を散らかしてしまう",zh:"我常把事情弄得一团糟"}},
  {f:"C",k:-1,t:{ko:"물건을 제자리에 두는 것을 자주 잊는다",en:"I often forget to put things back in their proper place",ja:"物を元の場所に戻すのをよく忘れる",zh:"我经常忘记把东西放回原处"}},
  {f:"C",k:-1,t:{ko:"해야 할 일을 미루거나 회피한다",en:"I shirk my duties",ja:"やるべきことをさぼってしまう",zh:"我会逃避自己该做的事"}},
  {f:"S",k:1, t:{ko:"대체로 느긋한 편이다",en:"I am relaxed most of the time",ja:"たいていリラックスしている",zh:"我大部分时间都很放松"}},
  {f:"S",k:1, t:{ko:"우울해지는 일이 거의 없다",en:"I seldom feel blue",ja:"落ち込むことはめったにない",zh:"我很少感到忧郁"}},
  {f:"S",k:-1,t:{ko:"스트레스를 쉽게 받는다",en:"I get stressed out easily",ja:"ストレスを感じやすい",zh:"我容易感到压力"}},
  {f:"S",k:-1,t:{ko:"이런저런 걱정이 많다",en:"I worry about things",ja:"いろいろ心配する",zh:"我常常担心各种事情"}},
  {f:"S",k:-1,t:{ko:"사소한 일에도 마음이 흔들린다",en:"I am easily disturbed",ja:"ちょっとしたことで動揺する",zh:"我容易心神不宁"}},
  {f:"S",k:-1,t:{ko:"쉽게 속상해한다",en:"I get upset easily",ja:"すぐに動揺してしまう",zh:"我容易感到难过"}},
  {f:"S",k:-1,t:{ko:"기분이 자주 바뀐다",en:"I change my mood a lot",ja:"気分がよく変わる",zh:"我情绪多变"}},
  {f:"S",k:-1,t:{ko:"감정 기복이 심한 편이다",en:"I have frequent mood swings",ja:"気分の浮き沈みが激しい",zh:"我情绪起伏频繁"}},
  {f:"S",k:-1,t:{ko:"쉽게 짜증이 난다",en:"I get irritated easily",ja:"イライラしやすい",zh:"我容易被激怒"}},
  {f:"S",k:-1,t:{ko:"자주 우울한 기분이 든다",en:"I often feel blue",ja:"よく憂うつな気分になる",zh:"我常常感到忧郁"}},
  {f:"O",k:1, t:{ko:"어휘력이 풍부하다",en:"I have a rich vocabulary",ja:"語彙が豊富だ",zh:"我词汇量丰富"}},

  {f:"O",k:1, t:{ko:"좋은 아이디어가 많다",en:"I have excellent ideas",ja:"優れたアイデアを持っている",zh:"我常有出色的想法"}},
  {f:"O",k:1, t:{ko:"무엇이든 빨리 이해하는 편이다",en:"I am quick to understand things",ja:"物事の理解が早い",zh:"我理解事物很快"}},
  {f:"O",k:1, t:{ko:"어려운 단어를 즐겨 쓴다",en:"I use difficult words",ja:"難しい言葉を使う",zh:"我会使用高深的词汇"}},
  {f:"O",k:1, t:{ko:"여러 가지를 깊이 생각하며 시간을 보낸다",en:"I spend time reflecting on things",ja:"物事をじっくり考える時間を持つ",zh:"我会花时间思考问题"}},
  {f:"O",k:1, t:{ko:"아이디어가 넘친다",en:"I am full of ideas",ja:"アイデアにあふれている",zh:"我满脑子都是想法"}},
  {f:"O",k:-1,t:{ko:"추상적인 개념은 이해하기 어렵다",en:"I have difficulty understanding abstract ideas",ja:"抽象的な考えを理解するのが難しい",zh:"我难以理解抽象的概念"}},

  {f:"O",k:-1,t:{ko:"상상력이 풍부한 편은 아니다",en:"I do not have a good imagination",ja:"想像力は豊かなほうではない",zh:"我的想象力不算丰富"}},
];

const FACTORS = ["E","A","C","S","O"];

const state = { screen:"home", index:0, answers:{}, order:[], lang:initLang };
const app = document.getElementById("app");
let advanceTimer = null;

function T() { return UI[state.lang]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function getScores() {
  const sums = {};
  FACTORS.forEach(f => sums[f] = 0);
  ITEMS.forEach((it, idx) => {
    const r = state.answers[idx];
    if (r === undefined) return;
    sums[it.f] += it.k === 1 ? r : 6 - r;
  });
  const out = {};
  FACTORS.forEach(f => {
    const pct = Math.round((sums[f] - 10) / 40 * 100);
    out[f] = { sum: sums[f], pct, lv: pct >= 65 ? "hi" : (pct <= 35 ? "lo" : "mid") };
  });
  return out;
}

      </div>
      <aside>
        <strong>${t.asideT}</strong>
        <ul>${t.aside.map(x => `<li>${x}</li>`).join("")}</ul>
      </aside>
    </div>
  </section>`;
}

function viewQuiz() {
  const t = T();
  const itemIdx = state.order[state.index];
  const it = ITEMS[itemIdx];
  const sel = state.answers[itemIdx];
  const btns = t.likert.map((lab, i) =>
    `<button data-action="rate" data-v="${i + 1}" class="${sel === i + 1 ? "selected" : ""}"><span class="dot"></span><span class="lab">${lab}</span></button>`).join("");
  return `
  <section class="quizWrap">
    <div class="quizHead"><span>${t.qLead}</span><strong>${String(state.index + 1).padStart(2, "0")} <small>/ ${N}</small></strong></div>
    <div class="progress"><i style="width:${((state.index + 1) / N) * 100}%"></i></div>
    <div class="questionCard">
      <h2 class="stmt">“${it.t[state.lang]}”</h2>
      <div class="likert">${btns}</div>
    </div>
    <div class="quizNav">
      <button data-action="prev" ${state.index === 0 ? "disabled" : ""}>${t.prev}</button>
      <button data-action="finish" ${Object.keys(state.answers).length === N ? "" : "disabled"} class="primary" style="min-width:0">${t.finish}</button>
    </div>
  </section>`;
}

function viewResult() {
  const t = T();
  const s = getScores();
  const rows = FACTORS.map(f => {
    const m = FMETA[f];
    const r = s[f];
    const lvText = r.lv === "hi" ? m.hi[state.lang] : (r.lv === "lo" ? m.lo[state.lang] : m.mid[state.lang]);
    const lvLabel = r.lv === "hi" ? t.hi : (r.lv === "lo" ? t.lo : t.mid);
    const lvClass = r.lv === "hi" ? "lvHigh" : (r.lv === "lo" ? "lvLow" : "lvMid");
    return `
    <div class="factorRow">
      <div class="fname"><strong>${m.name[state.lang]}</strong><span>${m.desc[state.lang]}</span></div>
      <div class="fbarWrap"><div class="fbar"><i style="width:${r.pct}%"></i></div><p class="fdesc">${lvText}</p></div>
      <div class="fscore"><b>${r.pct}</b><span class="${lvClass}">${lvLabel}</span></div>
    </div>`;
  }).join("");
  return `
  <section class="resultWrap">
    <div class="resultHero">
      <span class="stepLabel">${t.resLabel}</span>
      <h2>${t.resH2}</h2>
      <p>${t.resP}</p>
    </div>
    <div class="factors">${rows}</div>
    <div class="disclaimer">
      <strong>${t.discT}</strong>
      <p>${t.discP}</p>
    </div>
    <div class="resultActions">
      <button data-action="home">${t.home}</button>
      <button class="primary" data-action="setup">${t.retry} <span>↻</span></button>
    </div>
  </section>`;
}

function render() {
  document.documentElement.lang = state.lang;
  document.title = T().docTitle;
  const body = state.screen === "home" ? viewHome()
    : state.screen === "setup" ? viewSetup()
    : state.screen === "quiz" ? viewQuiz()
    : viewResult();
  app.innerHTML = `
  <header class="topbar">
    <button class="brand" data-action="home"><span class="brandMark">★</span> ${T().brand}</button>
    <span class="topRight"><span class="researchTag">${T().tag}</span>${langSw()}</span>
  </header>
  ${body}
  ${foot()}`;
}

function setScreen(s) { state.screen = s; render(); window.scrollTo(0, 0); }

app.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const a = btn.dataset.action;
  if (a === "home") setScreen("home");
  else if (a === "setup") setScreen("setup");
  else if (a === "lang") {
    state.lang = btn.dataset.l;
    try { localStorage.setItem("iq_lang", state.lang); } catch (err) {}
    render();
  }
  else if (a === "start") {
    state.index = 0; state.answers = {}; state.order = shuffle(ITEMS.map((_, i) => i));
    setScreen("quiz");
  }
  else if (a === "rate") {
    clearTimeout(advanceTimer);
    const itemIdx = state.order[state.index];
    state.answers[itemIdx] = Number(btn.dataset.v);
    render();
    advanceTimer = setTimeout(() => {
      if (state.screen !== "quiz") return;
      if (state.index < N - 1) { state.index++; render(); window.scrollTo(0, 0); }
      else if (Object.keys(state.answers).length === N) setScreen("result");
    }, 260);
  }
  else if (a === "prev") { clearTimeout(advanceTimer); state.index--; render(); }
  else if (a === "finish") { clearTimeout(advanceTimer); setScreen("result"); }
});

document.addEventListener("keydown", e => {
  if (state.screen !== "quiz") return;
  if (/^[1-5]$/.test(e.key)) {
    const b = document.querySelector(`[data-action="rate"][data-v="${e.key}"]`);
    if (b) b.click();
  }
});

render();
</script>
</body>
</html>

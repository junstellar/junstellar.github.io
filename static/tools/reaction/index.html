button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }

}
function foot() {
  return `<footer class="siteFoot"><span>${T().footL}</span><span><a href="${T().footToolsUrl}">${T().footTools}</a> · <a href="${T().footHomeUrl}">${T().footHome}</a></span></footer>`;
}

function viewHome() {
  const t = T();
  return `
  <section class="hero">
    <div class="eyebrow"><span>●</span> ${t.eyebrow}</div>
    <h1>${t.h1}</h1>
    <p class="heroCopy">${t.heroCopy}</p>
    <div class="facts"><div><strong>${ROUNDS}</strong><span>${t.f1}</span></div><div><strong>ms</strong><span>${t.f2}</span></div><div><strong>1</strong><span>${t.f3}</span></div></div>
    <button class="primary" data-action="test">${t.start} <span>→</span></button>
    <p class="notice">${t.notice}</p>
  </section>
  <section class="studyCard">
    <span class="cardIndex">${t.cardIndex}</span>
    <h2>${t.studyH2}</h2>
    <p>${t.studyP}</p>
    <div class="statLine"><span>${t.statL}</span><strong>${t.statV}</strong></div>
  </section>`;
}

function arenaHTML() {
  const t = T();
  if (state.phase === "idle") return `<div class="arena idle" data-action="arena"><span class="shape">■</span><p class="msg">${t.idleTitle}</p><p class="sub">${t.idleSub}</p></div>`;
  if (state.phase === "waiting") return `<div class="arena waiting" data-action="arena"><span class="shape">■</span><p class="msg">${t.waitTitle}</p><p class="sub">${t.waitSub}</p></div>`;
  if (state.phase === "go") return `<div class="arena go" data-action="arena"><span class="shape">●</span><p class="msg">${t.goTitle}</p></div>`;
  if (state.phase === "early") return `<div class="arena early" data-action="arena"><span class="shape">■</span><p class="msg">${t.earlyTitle}</p><p class="sub">${t.earlySub}</p></div>`;
  const last = state.times[state.times.length - 1];
  const sub = state.times.length >= ROUNDS ? t.clickedLast : t.clickedSub;
  return `<div class="arena clicked" data-action="arena"><span class="ms">${last}<small style="font-size:.35em"> ms</small></span><p class="sub">${sub}</p></div>`;
}

function viewTest() {
  const t = T();
  const chips = Array.from({length: ROUNDS}, (_, i) =>
    `<span class="${i < state.times.length ? "done" : ""}">${i < state.times.length ? state.times[i] + "ms" : "R" + (i + 1)}</span>`).join("");
  return `
  <section class="testWrap">
    <div class="testHead"><span>${t.roundLabel} ${Math.min(state.times.length + 1, ROUNDS)} / ${ROUNDS}</span><strong>⚡</strong></div>
    ${arenaHTML()}
    <div class="rounds">${chips}</div>
  </section>`;
}

function viewResult() {
  const t = T();
  const avg = Math.round(state.times.reduce((a, b) => a + b, 0) / state.times.length);
  const best = Math.min.apply(null, state.times);
  const b = band(avg);
  return `
  <section class="resultWrap">
    <div class="resultHero">
      <div>
        <span class="eyebrow" style="display:inline-block;margin-bottom:10px"><span>●</span> ${t.resLabel}</span>
        <h2>${t.resH2}</h2>
        <p><b>${t.bands[b][0]}</b> — ${t.bands[b][1]}</p>
      </div>
      <div class="msDial"><span>${t.avgL}</span><strong>${avg}</strong><small>ms · ${t.bands[b][0]}</small></div>
    </div>
    <div class="statsRow">
      <div class="statBox"><span>${t.bestL}</span><b>${best} ms</b></div>
      <div class="statBox"><span>${t.listL}</span><div class="chips">${state.times.map(x => `<i>${x}</i>`).join("")}</div></div>
    </div>
    <div class="disclaimer"><strong>${t.discT}</strong><p>${t.discP}</p></div>
    <div class="resultActions">
      <button data-action="home">${t.home}</button>
      <button class="primary" data-action="test">${t.retry} <span>↻</span></button>
    </div>
  </section>`;
}

function render() {
  document.documentElement.lang = state.lang;
  document.title = T().docTitle;
  const body = state.screen === "home" ? viewHome() : state.screen === "test" ? viewTest() : viewResult();
  app.innerHTML = `
  <header class="topbar">
    <button class="brand" data-action="home"><span class="brandMark">★</span> ${T().brand}</button>
    <span class="topRight"><span class="researchTag">${T().tag}</span>${langSw()}</span>
  </header>
  ${body}
  ${foot()}`;
}

function clearGoTimer() { clearTimeout(goTimer); goTimer = null; }

function startWaiting() {
  state.phase = "waiting";
  render();
  clearGoTimer();
  goTimer = setTimeout(() => {
    state.phase = "go";
    state.goAt = performance.now();
    render();
  }, 1500 + Math.random() * 2500);
}

function arenaClick() {
  if (state.phase === "idle") { state.times = []; startWaiting(); return; }
  if (state.phase === "waiting") { clearGoTimer(); state.phase = "early"; render(); return; }
  if (state.phase === "early") { startWaiting(); return; }
  if (state.phase === "go") {
    const ms = Math.round(performance.now() - state.goAt);
    state.times.push(ms);
    state.phase = "clicked";
    render();
    return;
  }
  if (state.phase === "clicked") {
    if (state.times.length >= ROUNDS) { state.screen = "result"; render(); window.scrollTo(0, 0); }
    else startWaiting();
  }
}

app.addEventListener("pointerdown", e => {
  const arena = e.target.closest('[data-action="arena"]');
  if (arena) { e.preventDefault(); arenaClick(); }
});
app.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const a = btn.dataset.action;
  if (a === "arena") return; // pointerdown에서 처리(클릭 지연 제거)
  if (a === "home") { clearGoTimer(); state.screen = "home"; state.phase = "idle"; render(); window.scrollTo(0, 0); }
  else if (a === "test") { clearGoTimer(); state.screen = "test"; state.phase = "idle"; state.times = []; render(); window.scrollTo(0, 0); }
  else if (a === "lang") {
    state.lang = btn.dataset.l;
    try { localStorage.setItem("iq_lang", state.lang); } catch (err) {}
    render();
  }
});

document.addEventListener("keydown", e => {
  if (state.screen !== "test" || e.repeat) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); arenaClick(); }
});

render();
</script>
</body>
</html>

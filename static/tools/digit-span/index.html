<style>
:root { --ink:#18221c; --paper:#f4f1e8; --mint:#c9f36a; --orange:#ff6b35; }

.researchTag { font-size:12px; border:1px solid var(--ink); border-radius:99px; padding:7px 12px; }
.langSw { display:flex; gap:4px; font-size:11px; }
.langSw button { padding:4px 7px; border:1px solid transparent; border-radius:3px; color:#6f7972; }

.hero { position:relative; max-width:1180px; width:100%; margin:0 auto; padding:clamp(12px,2.6vh,56px) 28px clamp(14px,3vh,64px); flex:1; display:flex; flex-direction:column; justify-content:center; }

h1 { position:relative; z-index:1; font-size:clamp(40px,min(7.6vw,9vh),104px); line-height:.98; letter-spacing:-.075em; max-width:950px; }

.primary:disabled { opacity:.35; cursor:not-allowed; transform:none; box-shadow:5px 5px 0 #c9cdc9; }
.notice { font-size:11px; color:#747b76; margin-top:clamp(10px,1.8vh,19px); }
.studyCard { background:var(--ink); color:white; padding:clamp(18px,3.6vh,52px) max(28px,calc((100vw - 1124px)/2)); display:grid; grid-template-columns:160px 1fr 1fr; gap:clamp(18px,3vh,44px) 44px; align-items:start; }
.cardIndex { color:var(--mint); font-size:12px; }

.statLine strong { font:700 clamp(20px,2.8vh,28px) Georgia,serif; color:var(--mint); }.statLine small{color:#9da8a0;font-size:13px}

.numpad button.fn{font:600 12px Arial;color:#566159}
.numHint{font-size:11px;color:#8b948d;text-align:center}
.tapArea { cursor:pointer; }

  footToolsUrl:"/lab/?lang=ja", footHomeUrl:"/ja/" },
zh:{ docTitle:"数字记忆测试 — 思考星实验室", tag:"数字广度(Digit Span)任务", brand:"思考星实验室",

  cls:{vlo:"非常低",lo:"偏低",blo:"中下",avg:"平均",bhi:"中上",sup:"优秀",vsup:"非常优秀"},
  totalL:"总广度", fwdL:"顺背广度", bwdL:"倒背广度", unit:"位",
  fwdRef:"成人平均 6~7位", bwdRef:"成人平均 4~5位",
  lv:{hi:"高于平均",mid:"平均范围",lo:"低于平均"},

const params = new URLSearchParams(location.search);
let storedLang = null;
try { storedLang = localStorage.getItem("iq_lang"); } catch (e) {}
const initLang = ["ko","en","ja","zh"].indexOf(params.get("lang")) >= 0 ? params.get("lang") : (["ko","en","ja","zh"].indexOf(storedLang) >= 0 ? storedLang : "ko");

const state = {
  screen:"home", lang:initLang,
  phase:"fwd", mode:"intro",       // mode: intro | show | recall | fb
  len:FWD_START, trial:1, seq:[], showIdx:0, entry:"",
  fails:0, spans:{ fwd:0, bwd:0 },
  fb:null                          // {ok, endPhase, cap, answer}
};
const app = document.getElementById("app");
let timer = null;

function T() { return UI[state.lang]; }
function clearTimer() { clearTimeout(timer); timer = null; }

function genSeq(n) {
  const s = [];
  for (let i = 0; i < n; i++) {
    let d;
    do { d = Math.floor(Math.random() * 10); } while (i > 0 && d === s[i - 1]);
    s.push(d);
  }
  return s;
}

function expected() {
  return state.phase === "fwd" ? state.seq.join("") : state.seq.slice().reverse().join("");
}

/* 환산점수: 연구 문헌의 성인 평균·표준편차를 지능검사 소검사 형식(평균 10·표준편차 3, 1~19)으로 단순 환산 */
const REF = { fwd:{m:6.5, sd:1.3}, bwd:{m:4.8, sd:1.3}, total:{m:11.3, sd:2.2} };
function toScaled(v, r) { return Math.max(1, Math.min(19, Math.round(10 + 3 * (v - r.m) / r.sd))); }
function percentile(z) {
  const t = 1 / (1 + .2316419 * Math.abs(z)); const d = .3989423 * Math.exp(-z * z / 2);
  const p = 1 - d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return Math.round(100 * (z >= 0 ? p : 1 - p));
}
function clsOf(s) { return s <= 3 ? "vlo" : s <= 5 ? "lo" : s <= 7 ? "blo" : s <= 12 ? "avg" : s <= 14 ? "bhi" : s <= 16 ? "sup" : "vsup"; }

/* 결과 점수 객체 — 추후 옵트인 익명 제출 시 이 객체를 그대로 사용 */
function getResult() {
  const fwd = state.spans.fwd, bwd = state.spans.bwd, total = fwd + bwd;
  const scaledT = toScaled(total, REF.total);
  return {
    tool:"digit-span", fwd, bwd, total,
    scaledF: toScaled(fwd, REF.fwd), scaledB: toScaled(bwd, REF.bwd), scaledT,
    pct: percentile((scaledT - 10) / 3), lang: state.lang
  };
}

function lvOf(v, midLo, midHi) { return v > midHi ? "hi" : (v < midLo ? "lo" : "mid"); }

function langSw() {
  return `<span class="langSw">` + [["ko","KO"],["en","EN"],["ja","日"],["zh","中"]].map(([l, lab]) =>
    `<button data-action="lang" data-l="${l}" class="${state.lang === l ? "on" : ""}">${lab}</button>`).join("") + `</span>`;
}
function foot() {
  return `<footer class="siteFoot"><span>${T().footL}</span><span><a href="${T().footToolsUrl}">${T().footTools}</a> · <a href="${T().footHomeUrl}">${T().footHome}</a></span></footer>`;
}

function viewHome() {
  const t = T();
  return `
  <section class="hero">
    <div class="eyebrow"><span>●</span> ${t.eyebrow}</div>
    <h1>${t.h1}</h1>
    <p class="heroCopy">${t.heroCopy}</p>
    <div class="facts"><div><strong>2</strong><span>${t.f1}</span></div><div><strong>7±2</strong><span>${t.f2}</span></div><div><strong>3</strong><span>${t.f3}</span></div></div>
    <button class="primary" data-action="test">${t.start} <span>→</span></button>
    <p class="notice">${t.notice}</p>
  </section>
  <section class="studyCard">
    <span class="cardIndex">${t.cardIndex}</span>
    <h2>${t.studyH2}</h2>
    <p>${t.studyP}</p>
    <div class="statLine"><span>${t.statL}</span><strong>${t.statV}</strong></div>
  </section>`;
}

function numpadHTML() {
  const t = T();
  const dots = [];
  for (let i = 0; i < state.len; i++) {
    dots.push(i < state.entry.length ? state.entry[i] : "<i>·</i>");
  }
  const keys = ["1","2","3","4","5","6","7","8","9","0"].map(d => `<button data-action="digit" data-d="${d}">${d}</button>`).join("");
  return `
    <div class="entryShow">${dots.join(" ")}</div>
    <div class="numWrap"><div class="numpad">${keys}<button class="fn" data-action="numclear">C</button><button class="fn" data-action="numback">←</button></div><p class="numHint">${t.numHint}</p></div>`;
}

function stageHTML() {
  const t = T();
  const phaseTag = state.phase === "fwd" ? t.phaseF : t.phaseB;
  if (state.mode === "intro") {
    const isBwdIntro = state.phase === "bwd";
    return `<div class="stage dark tapArea" data-action="stage">
      <span class="phaseTag">${phaseTag}</span>
      <p class="msg">${isBwdIntro ? t.introB : t.introF}</p>
      <p class="sub">${t.introHint}</p>
      <p class="msg" style="opacity:.85">▶ ${t.tapStart}</p>
    </div>`;
  }
  if (state.mode === "show") {
    const d = state.showIdx < state.seq.length && state.showIdx >= 0 ? state.seq[state.showIdx] : "";
    return `<div class="stage dark">
      <span class="phaseTag">${phaseTag} · ${t.lenTag(state.len)}</span>
      <span class="big">${d === "" ? "&nbsp;" : d}</span>
      <p class="sub">${t.watch}</p>
    </div>`;
  }
  if (state.mode === "recall") {
    return `<div class="stage">
      <span class="phaseTag">${phaseTag} · ${t.lenTag(state.len)} · ${t.trialTag(state.trial)}</span>
      <p class="msg">${state.phase === "fwd" ? t.recallF : t.recallB}</p>
      ${numpadHTML()}
    </div>`;
  }
  // fb
  const f = state.fb;
  if (f.ok) {
    return `<div class="stage tapArea">
      <p class="okBig">${t.okT}</p>
      <p class="sub">${f.cap ? t.okCap : t.okNext}</p>
    </div>`;
  }
  return `<div class="stage tapArea">
    <p class="noBig">${t.noT}</p>
    <p class="seqShow">${t.answerWas}: ${f.answer}</p>
    <p class="sub">${f.endPhase ? (state.phase === "fwd" ? t.toBwd : t.noEnd) : t.noRetry}</p>
  </div>`;
}

function viewTest() {
  const t = T();
  return `
  <section class="testWrap">
    <div class="testHead"><span>${state.phase === "fwd" ? t.phaseF : t.phaseB}</span><strong>${t.lenTag(state.len)} <small>· ${t.trialTag(state.trial)}</small></strong></div>
    ${stageHTML()}
  </section>`;
}

function viewResult() {
  const t = T();
  const r = getResult();
  const fLv = lvOf(r.fwd, 6, 7), bLv = lvOf(r.bwd, 4, 5);
  const lvClass = l => l === "hi" ? "lvHigh" : (l === "lo" ? "lvLow" : "lvMid");
  const cls = t.cls[clsOf(r.scaledT)];
  return `
  <section class="resultWrap">
    <div class="resultHero">
      <div>
        <span class="eyebrow" style="display:inline-block;margin-bottom:10px"><span>●</span> ${t.resLabel}</span>
        <h2>${t.resH2}</h2>
        <p><b>${cls}</b> · ${t.pct(r.pct)}<br>${t.fwdL} ${r.fwd}${t.unit} · ${t.bwdL} ${r.bwd}${t.unit} (${t.totalL} ${r.total}${t.unit})</p>
        <p style="font-size:12px;color:#7a837d;margin-top:8px">${t.scaledNote}</p>
      </div>
      <div class="spanDial"><span>${t.scaledL}</span><strong>${r.scaledT}</strong><small>/ 19 · ${cls}</small></div>
    </div>
    <div class="statsRow">
      <div class="statBox"><span>${t.fwdL} · ${t.fwdRef}</span><b>${r.fwd} ${t.unit}</b><small class="${lvClass(fLv)}">${t.lv[fLv]}</small><p>${t.scaledShort} ${r.scaledF}/19 — ${t.fwdCmt[fLv]}</p></div>
      <div class="statBox"><span>${t.bwdL} · ${t.bwdRef}</span><b>${r.bwd} ${t.unit}</b><small class="${lvClass(bLv)}">${t.lv[bLv]}</small><p>${t.scaledShort} ${r.scaledB}/19 — ${t.bwdCmt[bLv]}</p></div>
    </div>
    <div class="disclaimer"><strong>${t.discT}</strong><p>${t.discP}</p></div>
    <div class="resultActions">
      <button data-action="home">${t.home}</button>
      <button class="primary" data-action="test">${t.retry} <span>↻</span></button>
    </div>
  </section>`;
}

function render() {
  document.documentElement.lang = state.lang;
  document.title = T().docTitle;
  const body = state.screen === "home" ? viewHome() : state.screen === "test" ? viewTest() : viewResult();
  app.innerHTML = `
  <header class="topbar">
    <button class="brand" data-action="home"><span class="brandMark">★</span> ${T().brand}</button>
    <span class="topRight"><span class="researchTag">${T().tag}</span>${langSw()}</span>
  </header>
  ${body}
  ${foot()}`;
}

function startTest() {
  clearTimer();
  state.screen = "test"; state.phase = "fwd"; state.mode = "intro";
  state.len = FWD_START; state.trial = 1; state.fails = 0;
  state.spans = { fwd:0, bwd:0 };
  render(); window.scrollTo(0, 0);
}

function startTrial() {
  clearTimer();
  state.seq = genSeq(state.len);
  state.entry = "";
  state.mode = "show"; state.showIdx = -1;
  let cur = -1;
  const step = () => {
    cur++;
    if (cur >= state.seq.length) { state.mode = "recall"; render(); return; }
    state.showIdx = cur;
    render();
    timer = setTimeout(() => {
      const d = document.querySelector(".stage .big");
      if (d) d.innerHTML = "&nbsp;";
      timer = setTimeout(step, GAP_MS);
    }, SHOW_MS);
  };
  render();
  timer = setTimeout(step, 500);
}

function submitEntry() {
  if (state.entry.length !== state.len) return;
  clearTimer();
  const ok = state.entry === expected();
  if (ok) {
    state.spans[state.phase] = state.len;
    const cap = state.len >= MAX_LEN;
    state.fb = { ok:true, cap, endPhase:cap, answer:"" };
    if (!cap) { state.len++; state.trial = 1; state.fails = 0; }
  } else {
    state.fails++;
    const endPhase = state.fails >= 2;
    state.fb = { ok:false, cap:false, endPhase, answer: expected().split("").join(" ") };
    if (!endPhase) state.trial = 2;
  }
  state.mode = "fb";
  render();
  timer = setTimeout(advanceAfterFb, state.fb.ok ? FB_MS : FB_MS + 800);
}

function advanceAfterFb() {
  clearTimer();
  const f = state.fb;
  if (f.endPhase) {
    if (state.phase === "fwd") {
      state.phase = "bwd"; state.mode = "intro";
      state.len = BWD_START; state.trial = 1; state.fails = 0;
      render();
    } else {
      state.screen = "result";
      render(); window.scrollTo(0, 0);
    }
  } else {
    startTrial();
  }
}

function inputDigit(d) {
  if (state.screen !== "test" || state.mode !== "recall") return;
  if (state.entry.length >= state.len) return;
  state.entry += d;
  if (state.entry.length === state.len) {
    render();
    timer = setTimeout(submitEntry, 250);
  } else {
    render();
  }
}
function inputBack() {
  if (state.mode !== "recall") return;
  clearTimer();
  state.entry = state.entry.slice(0, -1);
  render();
}

app.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const a = btn.dataset.action;
  if (a === "home") { clearTimer(); state.screen = "home"; render(); window.scrollTo(0, 0); }
  else if (a === "test") startTest();
  else if (a === "lang") {
    state.lang = btn.dataset.l;
    try { localStorage.setItem("iq_lang", state.lang); } catch (err) {}
    render();
  }
  else if (a === "stage") { if (state.mode === "intro") startTrial(); }
  else if (a === "digit") inputDigit(btn.dataset.d);
  else if (a === "numback") inputBack();
  else if (a === "numclear") { if (state.mode === "recall") { clearTimer(); state.entry = ""; render(); } }
});

// 숫자 제시 중 탭을 벗어나면 타이머가 늘어져 측정이 왜곡됨 → 해당 시도를 취소하고 안내로 복귀
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state.screen === "test" && state.mode === "show") {
    clearTimer(); state.mode = "intro"; render();
  }
});

document.addEventListener("keydown", e => {
  if (state.screen !== "test") return;
  if (state.mode === "intro" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startTrial(); return; }
  if (state.mode !== "recall") return;
  if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
  else if (e.key === "Backspace") { e.preventDefault(); inputBack(); }
});

render();
</script>
</body>
</html>

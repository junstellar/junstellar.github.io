<body>
<div class="shell" id="app"></div>

<script>
"use strict";

const INK = "#18221c";

function prim(s, f){
  const K = `fill="${f ? INK : "none"}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"`;
  const LN = `stroke="${INK}" stroke-width="7" stroke-linecap="round"`;
  switch(s){
    case "cir": return `<circle cx="50" cy="50" r="31" ${K}/>`;
    case "sq": return `<rect x="21" y="21" width="58" height="58" ${K}/>`;
    case "tri": return `<polygon points="50,15 83,80 17,80" ${K}/>`;
    case "dia": return `<polygon points="50,11 89,50 50,89 11,50" ${K}/>`;
    case "arr": return `<polygon points="50,10 77,44 60,44 60,90 40,90 40,44 23,44" ${K}/>`;
    case "vln": return `<line x1="50" y1="15" x2="50" y2="85" ${LN}/>`;
    case "hln": return `<line x1="15" y1="50" x2="85" y2="50" ${LN}/>`;
    case "dl": return `<line x1="22" y1="22" x2="78" y2="78" ${LN}/>`;
    case "dr": return `<line x1="22" y1="78" x2="78" y2="22" ${LN}/>`;
    case "plus": return prim("vln") + prim("hln");
    case "x": return prim("dl") + prim("dr");
  }
  return "";
}

function specSVG(c, px){
  let inner;
  if (c.pair) {
    const f = c.f ? 1 : 0;
    inner = `<g transform="translate(1,26) scale(.48)">${prim(c.pair[0],f)}</g><g transform="translate(51,26) scale(.48)">${prim(c.pair[1],f)}</g>`;
  } else if (c.cell !== undefined) {
    const P = [[18,18],[50,18],[50,50],[18,50]][c.cell];
    inner = `<rect x="18" y="18" width="64" height="64" fill="none" stroke="${INK}" stroke-width="5"/><line x1="50" y1="18" x2="50" y2="82" stroke="${INK}" stroke-width="5"/><line x1="18" y1="50" x2="82" y2="50" stroke="${INK}" stroke-width="5"/><rect x="${P[0]}" y="${P[1]}" width="32" height="32" fill="${INK}"/>`;
  } else if (c.n) {
    const L = {1:[[50,50]],2:[[31,50],[69,50]],3:[[50,31],[31,69],[69,69]],4:[[31,31],[69,31],[31,69],[69,69]]}[c.n];
    const f = c.f === 0 ? 0 : 1;
    inner = L.map(p => `<g transform="translate(${p[0]-17},${p[1]-17}) scale(.34)">${prim(c.s || "cir", f)}</g>`).join("");
  } else {
    inner = prim(c.s, c.f);
    if (c.ov) inner += prim(c.ov, 0);
    if (c.in) inner += `<g transform="translate(32.5,32.5) scale(.35)">${prim(c.in.s, c.in.f)}</g>`;
  }
  let t = "";
  if (c.r) t += `rotate(${c.r} 50 50) `;
  if (c.k) t += `translate(${(50 * (1 - c.k)).toFixed(1)} ${(50 * (1 - c.k)).toFixed(1)}) scale(${c.k})`;
  if (t) inner = `<g transform="${t}">${inner}</g>`;
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}" aria-hidden="true" focusable="false">${inner}</svg>`;
}

function figHTML(fig){
  const cell = c => `<div class="figCell">${c ? specSVG(c, 62) : '<span class="qmk">?</span>'}</div>`;
  if (fig.g) return `<div class="figGrid">${fig.g.map(cell).join("")}</div>`;
  if (fig.a) return `<div class="figRow">${cell(fig.a[0])}<span>:</span>${cell(fig.a[1])}<span>=</span>${cell(fig.a[2])}<span>:</span>${cell(null)}</div>`;
  return "";
}

const V = "언어추론", M = "행렬추론", N = "수열추론", F = "도형유추";
const DAYS = {
  ko:["월요일","화요일","수요일","목요일","금요일","토요일","일요일"],
  en:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
  ja:["月曜日","火曜日","水曜日","木曜日","金曜日","土曜日","日曜日"],
  zh:["星期一","星期二","星期三","星期四","星期五","星期六","星期日"]
};
function days(order){ return { ko:order.map(i=>DAYS.ko[i]), en:order.map(i=>DAYS.en[i]), ja:order.map(i=>DAYS.ja[i]), zh:order.map(i=>DAYS.zh[i]) }; }

/* ---- UI 문자열 (4개 언어) ---- */
const UI = {
ko:{
  docTitle:"생각별 IQ 연구소 — 어린이 IQ 테스트",

  h1:"정답보다 중요한 건,<br><em>생각하는 과정</em>이에요.",
  heroCopy:b=>`문제은행 ${b}문항에서 연령에 맞는 27문제가 매번 새로 출제됩니다. 답은 서버로 전송되지 않고 이 브라우저 안에서만 계산됩니다.`,
  f1:"문항 · 매회", f2:"문제은행", f3:"추론 영역",
  start:"테스트 시작하기", notice:"오락·교육용 참고 검사이며 전문 지능검사나 진단을 대신하지 않습니다.",
  cardIndex:"01 / 연구 근거", studyH2:"쌓여 있는 연구자료에서<br>출발했습니다.",
  studyP:"2025년 발표된 Children’s ICAR 검증 연구의 27문항 구성(영역 비율·8지선다·수열 주관식)을 따릅니다. 문항은 독자 제작 문제은행에서 연령대별(만 10~11세 / 12~14세)로 매회 무작위 출제됩니다.",
  statL:"플란데런 연구표본 평균",
  setupStep:"시작 전 확인", setupH2:"어린이와 보호자가<br>함께 확인해 주세요.",
  ageLabel:"어린이의 만 나이", ageOpt:n=>`만 ${n}세`,
  setNote:s=>`만 10~11세는 <b>기본 세트</b>, 만 12~14세는 <b>심화 세트</b>에서 매번 27문항이 무작위로 출제됩니다. 지금 선택: <b>${s}</b>`,

    p:{ko:"수진이는 태호보다 빠르고, 태호는 민아보다 빠릅니다. 지훈이는 수진이보다 빠르고, 하늘이는 민아보다 느립니다. 세 번째로 빠른 사람은?",en:"Sujin runs faster than Taeho, and Taeho is faster than Mina. Jihun is faster than Sujin, and Haneul is slower than Mina. Who is the third fastest?",ja:"スジンはテホより速く、テホはミナより速い。ジフンはスジンより速く、ハヌルはミナより遅い。3番目に速いのは?",zh:"秀珍比泰浩快，泰浩比敏雅快。志勋比秀珍快，荷娜比敏雅慢。第三快的是谁？"},
    c:{ko:["태호","수진","민아","지훈","하늘","알 수 없다","두 명일 수 있다"],en:["Taeho","Sujin","Mina","Jihun","Haneul","Cannot be determined","It could be two people"],ja:["テホ","スジン","ミナ","ジフン","ハヌル","どれとも言えない","2人あり得る"],zh:["泰浩","秀珍","敏雅","志勋","荷娜","无法确定","可能有两个人"]},
    n:{ko:"지훈 > 수진 > 태호 > 민아 > 하늘 순서예요.",en:"Order: Jihun > Sujin > Taeho > Mina > Haneul.",ja:"ジフン > スジン > テホ > ミナ > ハヌルの順です。",zh:"顺序：志勋 > 秀珍 > 泰浩 > 敏雅 > 荷娜。"} },
  { area:V, answer:0,
    p:{ko:"내일이 수요일이 아니라 모레가 수요일이라면, 오늘은 무슨 요일일까요?",en:"If it is the day after tomorrow (not tomorrow) that is Wednesday, what day is it today?",ja:"明日ではなく明後日が水曜日なら、今日は何曜日?",zh:"如果是后天（而不是明天）是星期三，那么今天是星期几？"},
    c:days([0,1,2,3,4,5,6]),
    n:{ko:"모레가 수요일이면 오늘은 이틀 전인 월요일이에요.",en:"Two days before Wednesday is Monday.",ja:"明後日が水曜なら、今日はその2日前の月曜です。",zh:"后天是星期三，今天就是两天前的星期一。"} },
  { area:V, answer:0,
    p:{ko:"'비가 오면 소풍을 취소한다'가 참일 때, 소풍이 취소되지 않았다면 반드시 맞는 말은?",en:"'If it rains, the picnic is canceled' is true. The picnic was not canceled. Which must be true?",ja:"「雨が降れば遠足は中止」が正しいとき、遠足が中止されなかったなら必ず正しいのは?",zh:"'如果下雨，郊游就取消'为真。郊游没有被取消。哪句一定正确？"},
    c:{ko:["비가 오지 않았다","비가 왔다","소풍을 갔다","소풍 장소가 바뀌었다","날씨와 관계없다","비가 올 예정이다","알 수 없다"],en:["It did not rain","It rained","They went on the picnic","The picnic location changed","Weather does not matter","It will rain soon","It cannot be determined"],ja:["雨は降らなかった","雨が降った","遠足に行った","場所が変わった","天気と関係ない","これから雨が降る","どれとも言えない"],zh:["没有下雨","下了雨","去郊游了","郊游地点变了","与天气无关","快要下雨了","无法确定"]},
    n:{ko:"결과가 일어나지 않았다면 그 조건도 일어나지 않은 거예요.",en:"If the result didn't happen, the condition didn't either (contrapositive).",ja:"結果が起きていないなら、条件も起きていません(対偶)。",zh:"结果没发生，条件也就没发生（逆否命题）。"} },
  { area:V, answer:0,
    p:{ko:"어제가 금요일의 사흘 후였다면, 내일은 무슨 요일일까요?",en:"If yesterday was three days after Friday, what day is tomorrow?",ja:"昨日が金曜日の3日後だったなら、明日は何曜日?",zh:"如果昨天是星期五的三天后，那么明天是星期几？"},
    c:days([2,1,3,4,0,5,6]),
    n:{ko:"어제는 월요일(금+3일), 오늘은 화요일, 내일은 수요일이에요.",en:"Yesterday Monday (Fri+3) → today Tuesday → tomorrow Wednesday.",ja:"昨日は月曜(金+3)、今日は火曜、明日は水曜です。",zh:"昨天是星期一(五+3)，今天星期二，明天星期三。"} },
  { area:V, answer:0,
    p:{ko:"모든 장미는 꽃이다. 어떤 꽃은 빨갛다. 이때 반드시 맞는 말은?",en:"All roses are flowers. Some flowers are red. Which must be true?",ja:"すべてのバラは花だ。ある花は赤い。必ず正しいのは?",zh:"所有玫瑰都是花。有些花是红色的。哪句一定正确？"},
    c:{ko:["반드시 맞는 말은 없다","어떤 장미는 빨갛다","빨간 장미는 없다","모든 장미는 빨갛다","어떤 꽃은 장미가 아니다","모든 꽃은 장미다","빨간 것은 모두 꽃이다"],en:["None of these must be true","Some roses are red","No roses are red","All roses are red","Some flowers are not roses","All flowers are roses","Everything red is a flower"],ja:["必ず正しいものはない","あるバラは赤い","赤いバラはない","すべてのバラは赤い","バラでない花がある","すべての花はバラだ","赤いものはすべて花だ"],zh:["没有一定正确的","有些玫瑰是红的","没有红玫瑰","所有玫瑰都是红的","有些花不是玫瑰","所有花都是玫瑰","红色的都是花"]},
    n:{ko:"'어떤 꽃'이 장미라는 보장이 없어서 어느 것도 확실하지 않아요.",en:"The red flowers may or may not be roses, so nothing is guaranteed.",ja:"赤い花がバラだという保証がないため、どれも確実ではありません。",zh:"红色的花不一定是玫瑰，所以都不能确定。"} },
  { area:V, answer:0,
    p:{ko:"모레가 목요일의 이틀 전이라면, 오늘은 무슨 요일일까요?",en:"If the day after tomorrow is two days before Thursday, what day is it today?",ja:"明後日が木曜日の2日前なら、今日は何曜日?",zh:"如果后天是星期四的前两天，那么今天是星期几？"},
    c:days([6,0,1,2,3,4,5]),

  { area:V, answer:0,

    n:{ko:"90도 돌리면서 크기도 작아지는 관계예요.",en:"Rotate 90° and shrink.",ja:"90度回して小さくなる関係です。",zh:"旋转90度并变小。"} },
  { area:F, fig:{a:[{s:"sq",in:{s:"cir"}},{s:"sq",in:{s:"cir",f:1}},{s:"cir",in:{s:"tri"}}]}, choices:[{s:"cir",in:{s:"tri",f:1}},{s:"cir",in:{s:"tri"}},{s:"tri",in:{s:"cir",f:1}},{s:"cir",in:{s:"sq",f:1}},{s:"cir",in:{s:"dia",f:1}},{s:"sq",in:{s:"cir",f:1}},{s:"cir",in:{s:"tri"},k:.7}], answer:0,
    n:{ko:"바깥은 그대로 두고 안쪽 도형만 채우는 관계예요.",en:"The outer shape stays; only the inner one gets filled.",ja:"外はそのまま、中の図形だけ塗りつぶします。",zh:"外层不变，只填充内层图形。"} },
  { area:F, fig:{a:[{pair:["tri","sq"]},{pair:["sq","tri"],f:1},{pair:["cir","dia"]}]}, choices:[{pair:["dia","cir"],f:1},{pair:["dia","cir"]},{pair:["cir","dia"],f:1},{pair:["dia","dia"],f:1},{pair:["cir","cir"],f:1},{pair:["sq","tri"],f:1},{pair:["tri","dia"],f:1}], answer:0,
    n:{ko:"자리를 서로 바꾸고 채움도 바꿔요.",en:"Swap places and change the fill.",ja:"場所を入れ替え、塗りも変えます。",zh:"互换位置，同时改变填充。"} },
];

const AREA_MAX = { "언어추론":8, "행렬추론":6, "수열추론":7, "도형유추":6 };
const MEAN = 10.76, SD = 5.11;
const BANK_TOTAL = BANK_A.length + BANK_B.length;

const params = new URLSearchParams(location.search);
let storedLang = null;
try { storedLang = localStorage.getItem("iq_lang"); } catch (e) {}
const initLang = ["ko","en","ja","zh"].indexOf(params.get("lang")) >= 0 ? params.get("lang") : (["ko","en","ja","zh"].indexOf(storedLang) >= 0 ? storedLang : "ko");

const state = { screen:"home", age:12, consent:false, index:0, answers:{}, test:[], lang:initLang };
const app = document.getElementById("app");

function T() { return UI[state.lang]; }
function bank() { return state.age <= 11 ? BANK_A : BANK_B; }
function setName() { return state.age <= 11 ? T().basic : T().adv; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function sample(pool, k) {
  const idx = shuffle(pool.map((_, i) => i)).slice(0, k).sort((x, y) => x - y);
  return idx.map(i => pool[i]);
}
function drawTest() {
  const B = bank();
  const test = [];
  Object.keys(AREA_MAX).forEach(area => {
    sample(B.filter(q => q.area === area), AREA_MAX[area]).forEach(q => {
      if (q.input) test.push({ ref:q });
      else {
        const ord = shuffle([0,1,2,3,4,5,6]);
        test.push({ ref:q, ord, answer: ord.indexOf(q.answer) });
      }
    });
  });
  return test;
}

function qPrompt(t) {
  const q = t.ref;
  if (q.p) return q.p[state.lang];
  if (q.input) return T().num;
  return q.fig.g ? T().mat : T().ana;
}
function qChoice(t, i, px) {
  if (i === 7) return T().dunno;
  const q = t.ref;
  if (q.c) return q.c[state.lang][t.ord[i]];
  return specSVG(q.choices[t.ord[i]], px);
}
function qNote(t) { return t.ref.n[state.lang]; }

function referenceScore(raw) { return Math.max(55, Math.min(145, Math.round(100 + 15 * ((raw - MEAN) / SD)))); }
function percentile(z) {
  const t = 1 / (1 + .2316419 * Math.abs(z)); const d = .3989423 * Math.exp(-z * z / 2);
  const p = 1 - d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return Math.round(100 * (z >= 0 ? p : 1 - p));
}
function isCorrect(t, ans) {
  if (ans === undefined || ans === "") return false;
  return t.ref.input ? Number(ans) === t.ref.answer : ans === t.answer;
}
function getSummary() {
  const areas = {}; Object.keys(AREA_MAX).forEach(k => areas[k] = 0);
  let raw = 0;
  state.test.forEach((t, i) => { if (isCorrect(t, state.answers[i])) { raw++; areas[t.ref.area]++; } });
  const z = (raw - MEAN) / SD;
  return { raw, areas, z, score: referenceScore(raw), pct: percentile(z) };
}

function langSw() {
  return `<span class="langSw">` + [["ko","KO"],["en","EN"],["ja","日"],["zh","中"]].map(([l, lab]) =>
    `<button data-action="lang" data-l="${l}" class="${state.lang === l ? "on" : ""}">${lab}</button>`).join("") + `</span>`;
}
function foot() {
  return `<footer class="siteFoot"><span>${T().footL}</span><span><a href="${T().footToolsUrl}">${T().footTools}</a> · <a href="${T().footHomeUrl}">${T().footHome}</a></span></footer>`;
}

function viewHome() {
  const t = T();
  return `
  <section class="hero">
    <div class="eyebrow"><span>●</span> ${t.eyebrow}</div>
    <h1>${t.h1}</h1>
    <p class="heroCopy">${t.heroCopy(BANK_TOTAL)}</p>
    <div class="facts"><div><strong>27</strong><span>${t.f1}</span></div><div><strong>${BANK_TOTAL}</strong><span>${t.f2}</span></div><div><strong>4</strong><span>${t.f3}</span></div></div>
    <button class="primary" data-action="setup">${t.start} <span>→</span></button>
    <p class="notice">${t.notice}</p>
  </section>
  <section class="studyCard">
    <span class="cardIndex">${t.cardIndex}</span>
    <h2>${t.studyH2}</h2>
    <p>${t.studyP}</p>
    <div class="statLine"><span>${t.statL}</span><strong>10.76 <small>/ 27</small></strong></div>
  </section>`;
}

function viewSetup() {
  const t = T();
  const opts = [10, 11, 12, 13, 14].map(n => `<option value="${n}" ${state.age === n ? "selected" : ""}>${t.ageOpt(n)}</option>`).join("");
  return `
  <section class="setupWrap">
    <div class="stepLabel">${t.setupStep}</div>
    <h2>${t.setupH2}</h2>
    <div class="setupGrid">
      <div class="setupForm">
        <label for="age">${t.ageLabel}</label>
        <select id="age">${opts}</select>
        <p class="setNote">${t.setNote(setName())}</p>
        <label class="check"><input type="checkbox" id="consent" ${state.consent ? "checked" : ""}><span>${t.consent}</span></label>
        <button class="primary wide" data-action="start" ${state.consent ? "" : "disabled"}>${t.ready} <span>→</span></button>
      </div>
      <aside>
        <strong>${t.asideT}</strong>
        <ul>${t.aside.map(x => `<li>${x}</li>`).join("")}</ul>
      </aside>
    </div>
  </section>`;
}

function numpadHTML(val) {
  const t = T();
  const show = val && val.length
    ? `<div class="numShow">${val}</div>`
    : `<div class="numShow empty">${t.numEmpty}</div>`;
  const keys = ["1","2","3","4","5","6","7","8","9","0"].map(d => `<button data-action="digit" data-d="${d}">${d}</button>`).join("");
  return `<div class="numWrap">${show}<div class="numpad">${keys}<button class="fn" data-action="numclear">${t.numClear}</button><button class="fn" data-action="numback">←</button></div><p class="numHint">${t.numHint}</p></div>`;
}

function viewQuiz() {
  const t = T();
  const item = state.test[state.index];
  const sel = state.answers[state.index];
  const answered = item.ref.input ? (sel !== undefined && sel !== "") : sel !== undefined;
  let body;
  if (item.ref.input) {
    body = numpadHTML(sel || "");
  } else {
    const figc = !item.ref.c;
    const btns = [];
    for (let i = 0; i < 8; i++) {
      btns.push(`<button data-action="choose" data-i="${i}" class="${sel === i ? "selected" : ""}"><span>${String.fromCharCode(65 + i)}</span>${qChoice(item, i, 44)}</button>`);
    }
    body = `<div class="choices c8 ${figc ? "figc" : ""}">${btns.join("")}</div>`;
  }
  return `
  <section class="quizWrap">
    <div class="quizHead"><span>${t.areaName[item.ref.area]} · ${setName()}</span><strong>${String(state.index + 1).padStart(2, "0")} <small>/ 27</small></strong></div>
    <div class="progress"><i style="width:${((state.index + 1) / 27) * 100}%"></i></div>
    <div class="questionCard">
      <p class="areaDesc">${t.areaDesc[item.ref.area]}</p>
      <h2>${qPrompt(item)}</h2>
      ${item.ref.visual ? `<div class="visual" aria-label="${item.ref.visual}">${item.ref.visual}</div>` : ""}
      ${item.ref.fig ? figHTML(item.ref.fig) : ""}
      ${body}
    </div>
    <div class="quizNav">
      <button data-action="prev" ${state.index === 0 ? "disabled" : ""}>${t.prev}</button>
      ${state.index < 26
        ? `<button class="next" data-action="next" ${answered ? "" : "disabled"}>${t.next}</button>`
        : `<button class="next" data-action="finish" ${answered ? "" : "disabled"}>${t.finish}</button>`}
    </div>
  </section>`;
}

function viewResult() {
  const t = T();
  const s = getSummary();
  const areaRows = Object.keys(AREA_MAX).map(a => `
    <div class="areaRow">
      <div><strong>${t.areaName[a]}</strong><span>${t.areaDesc[a]}</span></div>
      <div class="bar"><i style="width:${(s.areas[a] / AREA_MAX[a]) * 100}%"></i></div>
      <b>${s.areas[a]} / ${AREA_MAX[a]}</b>
    </div>`).join("");
  const reviewRows = state.test.map((item, i) => {
    const user = state.answers[i];
    const ok = isCorrect(item, user);
    let mine, right;
    if (item.ref.input) {
      mine = (user !== undefined && user !== "") ? user : t.noAns;
      right = String(item.ref.answer);
    } else {
      mine = user !== undefined ? qChoice(item, user, 26) : t.noAns;
      right = qChoice(item, item.answer, 26);
    }
    return `
    <div class="reviewItem">
      <p class="meta">${String(i + 1).padStart(2, "0")} · ${t.areaName[item.ref.area]} · <b class="${ok ? "ok" : "no"}">${ok ? t.ok : t.no}</b></p>
      <p class="q">${qPrompt(item)}</p>
      ${item.ref.visual ? `<p class="reviewVisual">${item.ref.visual}</p>` : ""}
      <p>${t.mine}: ${mine}${ok ? "" : ` · ${t.right}: ${right}`}</p>
      <p class="note">${qNote(item)}</p>
    </div>`;
  }).join("");
  return `
  <section class="resultWrap">
    <div class="resultHero">
      <div>
        <span class="stepLabel">${t.resLabel(state.age, setName())}</span>
        <h2>${t.resH2}</h2>
        <p>${t.resP}</p>
      </div>
      <div class="scoreDial"><span>${t.scoreL}</span><strong>${s.score}</strong><small>${t.pct(s.pct)}</small></div>
    </div>
    <div class="resultGrid">
      <div class="areas"><h3>${t.areasH}</h3>${areaRows}</div>
      <aside class="rawCard"><span>${t.rawL}</span><strong>${s.raw}<small>/27</small></strong><p>${t.rawNote}</p></aside>
    </div>
    <div class="disclaimer">
      <strong>${t.discT}</strong>
      <p>${t.discP}</p>
    </div>
    <details class="review">
      <summary>${t.reviewT}</summary>
      ${reviewRows}
    </details>
    <div class="resultActions">
      <button data-action="home">${t.home}</button>
      <button class="primary" data-action="setup">${t.retry} <span>↻</span></button>
    </div>
  </section>`;
}

function render() {
  document.documentElement.lang = state.lang;
  document.title = T().docTitle;
  const body = state.screen === "home" ? viewHome()
    : state.screen === "setup" ? viewSetup()
    : state.screen === "quiz" ? viewQuiz()
    : viewResult();
  app.innerHTML = `
  <header class="topbar">
    <button class="brand" data-action="home"><span class="brandMark">Q</span> ${T().brand}</button>
    <span class="topRight"><span class="researchTag">${T().tag}</span>${langSw()}</span>
  </header>
  ${body}
  ${foot()}`;
}

function setScreen(s) { state.screen = s; render(); window.scrollTo(0, 0); }

function inputDigit(d) {
  const cur = state.answers[state.index] || "";
  if (cur.length >= 6) return;
  state.answers[state.index] = cur + d;
  render();
}
function inputBack() {
  const cur = state.answers[state.index] || "";
  state.answers[state.index] = cur.slice(0, -1);
  render();
}

app.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const a = btn.dataset.action;
  if (a === "home") setScreen("home");
  else if (a === "setup") setScreen("setup");
  else if (a === "lang") {
    state.lang = btn.dataset.l;
    try { localStorage.setItem("iq_lang", state.lang); } catch (err) {}
    render();
  }
  else if (a === "start") { state.index = 0; state.answers = {}; state.test = drawTest(); setScreen("quiz"); }
  else if (a === "choose") { state.answers[state.index] = Number(btn.dataset.i); render(); }
  else if (a === "digit") inputDigit(btn.dataset.d);
  else if (a === "numback") inputBack();
  else if (a === "numclear") { state.answers[state.index] = ""; render(); }
  else if (a === "prev") { state.index--; render(); }
  else if (a === "next") { state.index++; render(); window.scrollTo(0, 0); }
  else if (a === "finish") setScreen("result");
});

app.addEventListener("change", e => {
  if (e.target.id === "age") { state.age = Number(e.target.value); render(); }
  else if (e.target.id === "consent") { state.consent = e.target.checked; render(); }
});

document.addEventListener("keydown", e => {
  if (state.screen !== "quiz") return;
  const item = state.test[state.index];
  if (!item || !item.ref.input) return;
  if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
  else if (e.key === "Backspace") { e.preventDefault(); inputBack(); }
  else if (e.key === "Enter") {
    const sel = state.answers[state.index];
    if (sel !== undefined && sel !== "") {
      if (state.index < 26) { state.index++; render(); window.scrollTo(0, 0); }
      else setScreen("result");
    }
  }
});

render();
</script>
</body>
</html>

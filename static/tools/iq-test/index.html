<script>

const QUESTIONS = [
  { area:"언어추론", prompt:"새는 하늘을 날고, 물고기는 어디에서 움직일까요?", choices:["숲","물","구름","땅속"], answer:1, note:"대상과 주된 생활 공간의 관계를 찾는 문제예요." },

  { area:"언어추론", prompt:"연필 : 쓰기 = 가위 : ?", choices:["접기","자르기","붙이기","그리기"], answer:1, note:"도구와 쓰임의 관계를 찾는 문제예요." },
  { area:"언어추론", prompt:"모든 고래는 동물입니다. 파란이는 고래입니다. 반드시 맞는 말은?", choices:["파란이는 물고기다","파란이는 동물이다","모든 동물은 고래다","알 수 없다"], answer:1, note:"주어진 조건만으로 확실한 결론을 찾는 문제예요." },
  { area:"언어추론", prompt:"봄, 여름, 가을과 가장 같은 무리에 속하는 것은?", choices:["아침","겨울","비","바람"], answer:1, note:"공통된 범주를 찾는 문제예요." },
  { area:"언어추론", prompt:"민수는 지우보다 빠르고, 지우는 다연보다 빠릅니다. 가장 느린 사람은?", choices:["민수","지우","다연","알 수 없음"], answer:2, note:"여러 비교 관계를 순서대로 연결하는 문제예요." },
  { area:"언어추론", prompt:"‘조용히’와 가장 가까운 뜻은?", choices:["소리 없이","빠르게","즐겁게","똑바로"], answer:0, note:"문맥상 비슷한 뜻을 찾는 문제예요." },
  { area:"언어추론", prompt:"책장은 책을 보관합니다. 옷장은 무엇을 보관할까요?", choices:["신발","음식","옷","그릇"], answer:2, note:"사물의 이름과 기능 사이의 관계를 찾는 문제예요." },
  { area:"행렬추론", prompt:"빈칸에 들어갈 기호를 고르세요.", visual:"●  ○  ●  ○  ●  ?", choices:["●","○","▲","■"], answer:1, note:"두 기호가 번갈아 나타나요." },
  { area:"행렬추론", prompt:"빈칸에 들어갈 기호를 고르세요.", visual:"▲  ▲▲  ▲▲▲  ?", choices:["▲","▲▲","▲▲▲","▲▲▲▲"], answer:3, note:"한 단계마다 삼각형이 하나씩 늘어나요." },
  { area:"행렬추론", prompt:"같은 규칙으로 빈칸을 채우세요.", visual:"○ → ●   □ → ■   △ → ?", choices:["▲","△","◆","▽"], answer:0, note:"테두리 도형이 채워진 도형으로 바뀌어요." },
  { area:"행렬추론", prompt:"빈칸에 들어갈 배열은?", visual:"↑  →  ↓  ?", choices:["↑","←","↗","↓"], answer:1, note:"화살표가 시계 방향으로 90도씩 돌아가요." },
  { area:"행렬추론", prompt:"가로줄의 규칙을 아래에도 적용하세요.", visual:"● + ● = ●●   ▲ + ▲ = ?", choices:["▲","▲▲","●▲","■■"], answer:1, note:"같은 도형 두 개를 나란히 합치는 규칙이에요." },
  { area:"행렬추론", prompt:"빈칸에 들어갈 기호를 고르세요.", visual:"■ □ □   □ ■ □   □ □ ?", choices:["■","□","●","▲"], answer:0, note:"검은 사각형이 한 칸씩 오른쪽으로 이동해요." },
  { area:"수열추론", prompt:"다음 수는 무엇일까요?", visual:"2, 4, 6, 8, ?", choices:["9","10","11","12"], answer:1, note:"2씩 커지는 수열이에요." },
  { area:"수열추론", prompt:"다음 수는 무엇일까요?", visual:"3, 6, 12, 24, ?", choices:["30","36","42","48"], answer:3, note:"앞의 수에 2를 곱해요." },
  { area:"수열추론", prompt:"다음 수는 무엇일까요?", visual:"20, 17, 14, 11, ?", choices:["7","8","9","10"], answer:1, note:"3씩 작아지는 수열이에요." },
  { area:"수열추론", prompt:"다음 수는 무엇일까요?", visual:"1, 4, 9, 16, ?", choices:["20","24","25","36"], answer:2, note:"1², 2², 3², 4² 다음은 5²이에요." },
  { area:"수열추론", prompt:"다음 수는 무엇일까요?", visual:"2, 3, 5, 8, 12, ?", choices:["15","16","17","18"], answer:2, note:"더하는 수가 1, 2, 3, 4로 하나씩 커져요." },
  { area:"수열추론", prompt:"다음 수는 무엇일까요?", visual:"64, 32, 16, 8, ?", choices:["2","4","6","7"], answer:1, note:"앞의 수를 2로 나눠요." },
  { area:"수열추론", prompt:"다음 수는 무엇일까요?", visual:"5, 10, 8, 16, 14, ?", choices:["18","24","26","28"], answer:3, note:"2배 한 뒤 2를 빼는 규칙이 반복돼요." },
  { area:"도형유추", prompt:"첫 관계와 같은 답을 고르세요.", visual:"↑ : ↓ = → : ?", choices:["←","↑","↓","→"], answer:0, note:"방향을 정반대로 바꾸는 관계예요." },
  { area:"도형유추", prompt:"첫 관계와 같은 답을 고르세요.", visual:"○ : ● = □ : ?", choices:["□","■","●","◆"], answer:1, note:"빈 도형을 같은 모양의 채운 도형으로 바꿔요." },
  { area:"도형유추", prompt:"첫 관계와 같은 답을 고르세요.", visual:"△ : △△ = ○ : ?", choices:["○○","●","○○○","△○"], answer:0, note:"같은 도형을 하나 더 붙이는 관계예요." },
  { area:"도형유추", prompt:"180도 돌렸을 때 모양이 그대로인 것은?", choices:["↑","↗","●","▶"], answer:2, note:"원은 어느 방향으로 돌려도 같은 모습이에요." },
  { area:"도형유추", prompt:"다른 하나를 찾으세요.", choices:["△","□","○","◇"], answer:2, note:"나머지는 모두 곧은 선으로만 이루어져 있어요." },
  { area:"도형유추", prompt:"첫 관계와 같은 답을 고르세요.", visual:"▲■ : ■▲ = ●◆ : ?", choices:["●◆","◆●","●●","◆◆"], answer:1, note:"두 도형의 자리를 서로 바꾸는 관계예요." },
];

const AREA_MAX = { "언어추론":8, "행렬추론":6, "수열추론":7, "도형유추":6 };
const AREA_DESC = { "언어추론":"말의 의미와 논리 관계", "행렬추론":"규칙과 변화 발견", "수열추론":"숫자 사이의 규칙", "도형유추":"도형 관계와 공간 사고" };
const MEAN = 10.76, SD = 5.11;

const state = { screen:"home", age:12, consent:false, index:0, answers:{} };
const app = document.getElementById("app");

function referenceScore(raw) { return Math.max(55, Math.min(145, Math.round(100 + 15 * ((raw - MEAN) / SD)))); }
function percentile(z) {
  const t = 1 / (1 + .2316419 * Math.abs(z)); const d = .3989423 * Math.exp(-z * z / 2);
  const p = 1 - d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return Math.round(100 * (z >= 0 ? p : 1 - p));
}
function getSummary() {
  const areas = {}; Object.keys(AREA_MAX).forEach(k => areas[k] = 0);
  let raw = 0;
  QUESTIONS.forEach((q, i) => { if (state.answers[i] === q.answer) { raw++; areas[q.area]++; } });
  const z = (raw - MEAN) / SD;
  return { raw, areas, z, score: referenceScore(raw), pct: percentile(z) };
}

  <section class="hero">
    <div class="eyebrow"><span>●</span> 10–14세 어린이를 위한 인지 추론 테스트</div>
    <h1>정답보다 중요한 건,<br><em>생각하는 과정</em>이에요.</h1>
    <p class="heroCopy">27개의 흥미로운 문제로 언어, 도형, 수 규칙과 논리적 사고를 살펴보세요. 답은 서버로 전송되지 않고 이 브라우저 안에서만 계산됩니다.</p>
    <div class="facts"><div><strong>27</strong><span>문항</span></div><div><strong>20</strong><span>분 내외</span></div><div><strong>4</strong><span>추론 영역</span></div></div>
    <button class="primary" data-action="setup">테스트 시작하기 <span>→</span></button>
    <p class="notice">오락·교육용 참고 검사이며 전문 지능검사나 진단을 대신하지 않습니다.</p>
  </section>
  <section class="studyCard">
    <span class="cardIndex">01 / 연구 근거</span>
    <h2>쌓여 있는 연구자료에서<br>출발했습니다.</h2>
    <p>2025년 발표된 Children’s ICAR 검증 연구의 27문항 구성과 820명 표본 통계를 참고합니다. 현재 문항은 동일 영역으로 독자 제작한 예시 문항입니다.</p>
    <div class="statLine"><span>플란데런 연구표본 평균</span><strong>10.76 <small>/ 27</small></strong></div>
  </section>`;
}

function viewSetup() {
  const opts = [10, 11, 12, 13, 14].map(n => `<option value="${n}" ${state.age === n ? "selected" : ""}>만 ${n}세</option>`).join("");
  return `
  <section class="setupWrap">
    <div class="stepLabel">시작 전 확인</div>
    <h2>어린이와 보호자가<br>함께 확인해 주세요.</h2>
    <div class="setupGrid">
      <div class="setupForm">
        <label for="age">어린이의 만 나이</label>
        <select id="age">${opts}</select>
        <label class="check"><input type="checkbox" id="consent" ${state.consent ? "checked" : ""}><span>보호자와 함께 안내를 읽었으며, 이 결과가 전문적인 IQ 진단이 아니라는 점을 이해했습니다.</span></label>
        <button class="primary wide" data-action="start" ${state.consent ? "" : "disabled"}>준비됐어요 <span>→</span></button>
      </div>
      <aside>
        <strong>편안하게 풀어보세요</strong>
        <ul>
          <li>계산기나 검색은 사용하지 않아요.</li>
          <li>시간은 점수에 포함되지 않아요.</li>
          <li>모르겠다면 가장 알맞은 답을 골라요.</li>
          <li>이름·학교·연락처는 수집하지 않아요.</li>
        </ul>
      </aside>
    </div>
  </section>`;
}

function viewQuiz() {
  const q = QUESTIONS[state.index];
  const answered = state.answers[state.index] !== undefined;
  const choices = q.choices.map((c, i) =>
    `<button data-action="choose" data-i="${i}" class="${state.answers[state.index] === i ? "selected" : ""}"><span>${String.fromCharCode(65 + i)}</span>${c}</button>`).join("");
  return `
  <section class="quizWrap">
    <div class="quizHead"><span>${q.area}</span><strong>${String(state.index + 1).padStart(2, "0")} <small>/ 27</small></strong></div>
    <div class="progress"><i style="width:${((state.index + 1) / 27) * 100}%"></i></div>
    <div class="questionCard">
      <p class="areaDesc">${AREA_DESC[q.area]}</p>
      <h2>${q.prompt}</h2>
      ${q.visual ? `<div class="visual" aria-label="${q.visual}">${q.visual}</div>` : ""}
      <div class="choices">${choices}</div>
    </div>
    <div class="quizNav">
      <button data-action="prev" ${state.index === 0 ? "disabled" : ""}>← 이전</button>
      ${state.index < 26
        ? `<button class="next" data-action="next" ${answered ? "" : "disabled"}>다음 문제 →</button>`
        : `<button class="next" data-action="finish" ${answered ? "" : "disabled"}>결과 보기 →</button>`}
    </div>
  </section>`;
}

function viewResult() {
  const s = getSummary();
  const areaRows = Object.keys(AREA_MAX).map(a => `
    <div class="areaRow">
      <div><strong>${a}</strong><span>${AREA_DESC[a]}</span></div>
      <div class="bar"><i style="width:${(s.areas[a] / AREA_MAX[a]) * 100}%"></i></div>
      <b>${s.areas[a]} / ${AREA_MAX[a]}</b>
    </div>`).join("");
  const reviewRows = QUESTIONS.map((q, i) => {
    const user = state.answers[i];
    const ok = user === q.answer;
    return `
    <div class="reviewItem">
      <p class="meta">${String(i + 1).padStart(2, "0")} · ${q.area} · <b class="${ok ? "ok" : "no"}">${ok ? "정답" : "오답"}</b></p>
      <p class="q">${q.prompt}</p>
      ${q.visual ? `<p class="reviewVisual">${q.visual}</p>` : ""}
      <p>내가 고른 답: ${user !== undefined ? q.choices[user] : "무응답"}${ok ? "" : ` · 정답: ${q.choices[q.answer]}`}</p>
      <p class="note">${q.note}</p>
    </div>`;
  }).join("");
  return `
  <section class="resultWrap">
    <div class="resultHero">
      <div>
        <span class="stepLabel">만 ${state.age}세 · 연구표본 기준 참고 결과</span>
        <h2>차분하게 규칙을<br>찾아냈어요.</h2>
        <p>점수 하나보다 어떤 문제를 잘 풀었는지 함께 살펴보세요.</p>
      </div>
      <div class="scoreDial"><span>참고 추론점수</span><strong>${s.score}</strong><small>백분위 약 ${s.pct}%</small></div>
    </div>
    <div class="resultGrid">
      <div class="areas"><h3>영역별 결과</h3>${areaRows}</div>
      <aside class="rawCard"><span>원점수</span><strong>${s.raw}<small>/27</small></strong><p>플란데런 12세 중심 표본<br>평균 10.76 · 표준편차 5.11</p></aside>
    </div>
    <div class="disclaimer">
      <strong>이 점수는 어떻게 계산했나요?</strong>
      <p>2025년 Ch-ICAR 연구표본의 평균과 표준편차를 이용해 평균 100, 표준편차 15 형태로 단순 환산했습니다. 한국 어린이의 연령별 표준화 IQ가 아니며, 극단 점수와 개별 영역 해석에는 특히 주의해야 합니다.</p>
    </div>
    <details class="review">
      <summary>문항별 풀이 다시 보기 (27문항)</summary>
      ${reviewRows}
    </details>
    <div class="resultActions">
      <button data-action="home">처음으로</button>
      <button class="primary" data-action="setup">다시 풀기 <span>↻</span></button>
    </div>
  </section>`;
}

function render() {
  const body = state.screen === "home" ? viewHome()
    : state.screen === "setup" ? viewSetup()
    : state.screen === "quiz" ? viewQuiz()
    : viewResult();
  app.innerHTML = `
  <header class="topbar">
    <button class="brand" data-action="home"><span class="brandMark">Q</span> 생각별 IQ 연구소</button>
    <span class="researchTag">Ch-ICAR 연구 구조 기반</span>
  </header>
  ${body}
  ${foot}`;
}

function setScreen(s) { state.screen = s; render(); window.scrollTo(0, 0); }

app.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const a = btn.dataset.action;
  if (a === "home") setScreen("home");
  else if (a === "setup") setScreen("setup");
  else if (a === "start") { state.index = 0; state.answers = {}; setScreen("quiz"); }
  else if (a === "choose") { state.answers[state.index] = Number(btn.dataset.i); render(); }
  else if (a === "prev") { state.index--; render(); }
  else if (a === "next") { state.index++; render(); window.scrollTo(0, 0); }
  else if (a === "finish") setScreen("result");
});

app.addEventListener("change", e => {
  if (e.target.id === "age") state.age = Number(e.target.value);
  else if (e.target.id === "consent") { state.consent = e.target.checked; render(); }
});

render();
</script>
</body>
</html>

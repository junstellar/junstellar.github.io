<body>
<div class="shell" id="app"></div>

<script>
"use strict";

const INK = "#18221c";
const DUNNO = "모르겠어요";

function prim(s, f){
  const K = `fill="${f ? INK : "none"}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"`;
  const LN = `stroke="${INK}" stroke-width="7" stroke-linecap="round"`;
  switch(s){
    case "cir": return `<circle cx="50" cy="50" r="31" ${K}/>`;
    case "sq": return `<rect x="21" y="21" width="58" height="58" ${K}/>`;
    case "tri": return `<polygon points="50,15 83,80 17,80" ${K}/>`;
    case "dia": return `<polygon points="50,11 89,50 50,89 11,50" ${K}/>`;
    case "arr": return `<polygon points="50,10 77,44 60,44 60,90 40,90 40,44 23,44" ${K}/>`;
    case "vln": return `<line x1="50" y1="15" x2="50" y2="85" ${LN}/>`;
    case "hln": return `<line x1="15" y1="50" x2="85" y2="50" ${LN}/>`;
    case "dl": return `<line x1="22" y1="22" x2="78" y2="78" ${LN}/>`;
    case "dr": return `<line x1="22" y1="78" x2="78" y2="22" ${LN}/>`;
    case "plus": return prim("vln") + prim("hln");
    case "x": return prim("dl") + prim("dr");
  }
  return "";
}

function specSVG(c, px){
  let inner;
  if (c.pair) {
    const f = c.f ? 1 : 0;
    inner = `<g transform="translate(1,26) scale(.48)">${prim(c.pair[0],f)}</g><g transform="translate(51,26) scale(.48)">${prim(c.pair[1],f)}</g>`;
  } else if (c.cell !== undefined) {
    const P = [[18,18],[50,18],[50,50],[18,50]][c.cell];
    inner = `<rect x="18" y="18" width="64" height="64" fill="none" stroke="${INK}" stroke-width="5"/><line x1="50" y1="18" x2="50" y2="82" stroke="${INK}" stroke-width="5"/><line x1="18" y1="50" x2="82" y2="50" stroke="${INK}" stroke-width="5"/><rect x="${P[0]}" y="${P[1]}" width="32" height="32" fill="${INK}"/>`;
  } else if (c.n) {
    const L = {1:[[50,50]],2:[[31,50],[69,50]],3:[[50,31],[31,69],[69,69]],4:[[31,31],[69,31],[31,69],[69,69]]}[c.n];
    const f = c.f === 0 ? 0 : 1;
    inner = L.map(p => `<g transform="translate(${p[0]-17},${p[1]-17}) scale(.34)">${prim(c.s || "cir", f)}</g>`).join("");
  } else {
    inner = prim(c.s, c.f);
    if (c.ov) inner += prim(c.ov, 0);
    if (c.in) inner += `<g transform="translate(32.5,32.5) scale(.35)">${prim(c.in.s, c.in.f)}</g>`;
  }
  let t = "";
  if (c.r) t += `rotate(${c.r} 50 50) `;
  if (c.k) t += `translate(${(50 * (1 - c.k)).toFixed(1)} ${(50 * (1 - c.k)).toFixed(1)}) scale(${c.k})`;
  if (t) inner = `<g transform="${t}">${inner}</g>`;
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}" aria-hidden="true" focusable="false">${inner}</svg>`;
}

function figHTML(fig){
  const cell = c => `<div class="figCell">${c ? specSVG(c, 62) : '<span class="qmk">?</span>'}</div>`;
  if (fig.g) return `<div class="figGrid">${fig.g.map(cell).join("")}</div>`;
  if (fig.a) return `<div class="figRow">${cell(fig.a[0])}<span>:</span>${cell(fig.a[1])}<span>=</span>${cell(fig.a[2])}<span>:</span>${cell(null)}</div>`;
  return "";
}

const MAT = "규칙을 찾아 빈칸에 들어갈 그림을 고르세요.";
const ANA = "앞의 관계와 같도록 빈칸에 들어갈 그림을 고르세요.";
const NUM = "다음에 올 수를 직접 입력하세요.";
const V = "언어추론", M = "행렬추론", N = "수열추론", F = "도형유추";

/* 문항은행 — 객관식은 보기 7개(+'모르겠어요' 자동 추가), 수열은 주관식(answer=숫자). 각 영역 내에서 쉬운 문항 → 어려운 문항 순서. */

const BANK_A = [
  // 언어추론 (11)
  { area:V, prompt:"새는 하늘을 날고, 물고기는 어디에서 움직일까요?", choices:["물","숲","구름","땅속","하늘","모래","얼음"], answer:0, note:"대상과 주된 생활 공간의 관계를 찾는 문제예요." },
  { area:V, prompt:"연필 : 쓰기 = 가위 : ?", choices:["자르기","접기","붙이기","그리기","재기","지우기","색칠하기"], answer:0, note:"도구와 쓰임의 관계를 찾는 문제예요." },
  { area:V, prompt:"봄, 여름, 가을과 가장 같은 무리에 속하는 것은?", choices:["겨울","아침","비","바람","낮","구름","밤"], answer:0, note:"공통된 범주(계절)를 찾는 문제예요." },
  { area:V, prompt:"사과, 배, 포도와 가장 같은 무리에 속하는 것은?", choices:["수박","당근","감자","양파","오이","버섯","호박"], answer:0, note:"과일 무리에 속하는 것을 찾는 문제예요." },
  { area:V, prompt:"장갑 : 손 = 양말 : ?", choices:["발","신발","다리","무릎","팔","얼굴","머리"], answer:0, note:"물건과 그 물건을 끼우는 몸의 부위 관계예요." },
  { area:V, prompt:"의사 : 병원 = 선생님 : ?", choices:["학교","칠판","공부","학생","교과서","시험","급식실"], answer:0, note:"사람과 그 사람이 일하는 장소의 관계예요." },

const AREA_MAX = { "언어추론":8, "행렬추론":6, "수열추론":7, "도형유추":6 };
const AREA_DESC = { "언어추론":"말의 의미와 논리 관계", "행렬추론":"규칙과 변화 발견", "수열추론":"숫자 사이의 규칙", "도형유추":"도형 관계와 공간 사고" };
const MEAN = 10.76, SD = 5.11;
const BANK_TOTAL = BANK_A.length + BANK_B.length;

const state = { screen:"home", age:12, consent:false, index:0, answers:{}, test:[] };
const app = document.getElementById("app");

function bank() { return state.age <= 11 ? BANK_A : BANK_B; }
function setName() { return state.age <= 11 ? "기본 세트" : "심화 세트"; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function sample(pool, k) {
  const idx = shuffle(pool.map((_, i) => i)).slice(0, k).sort((x, y) => x - y);
  return idx.map(i => pool[i]);
}
function prepare(q) {
  if (q.input) return Object.assign({}, q);
  const ord = shuffle(q.choices.map((_, i) => i));
  return Object.assign({}, q, { choices: ord.map(i => q.choices[i]), answer: ord.indexOf(q.answer) });
}
function drawTest() {
  const B = bank();
  const test = [];
  Object.keys(AREA_MAX).forEach(area => {
    sample(B.filter(q => q.area === area), AREA_MAX[area]).forEach(q => test.push(prepare(q)));
  });
  return test;
}

function referenceScore(raw) { return Math.max(55, Math.min(145, Math.round(100 + 15 * ((raw - MEAN) / SD)))); }
function percentile(z) {
  const t = 1 / (1 + .2316419 * Math.abs(z)); const d = .3989423 * Math.exp(-z * z / 2);
  const p = 1 - d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return Math.round(100 * (z >= 0 ? p : 1 - p));
}
function isCorrect(q, ans) {
  if (ans === undefined || ans === "") return false;
  return q.input ? Number(ans) === q.answer : ans === q.answer;
}
function getSummary() {
  const areas = {}; Object.keys(AREA_MAX).forEach(k => areas[k] = 0);
  let raw = 0;
  state.test.forEach((q, i) => { if (isCorrect(q, state.answers[i])) { raw++; areas[q.area]++; } });
  const z = (raw - MEAN) / SD;
  return { raw, areas, z, score: referenceScore(raw), pct: percentile(z) };
}

const foot = `<footer class="siteFoot"><span>© To the Moon · 오락·교육용 참고 검사</span><span><a href="/%EB%8F%84%EA%B5%AC/">다른 도구 보기</a> · <a href="/">블로그 홈</a></span></footer>`;

function viewHome() {

  const opts = [10, 11, 12, 13, 14].map(n => `<option value="${n}" ${state.age === n ? "selected" : ""}>만 ${n}세</option>`).join("");

    <div class="setupGrid">

function choiceContent(q, i, px) {
  if (i === 7) return DUNNO;
  const c = q.choices[i];
  return typeof c === "object" ? specSVG(c, px) : c;
}

function numpadHTML(val) {
  const show = val && val.length
    ? `<div class="numShow">${val}</div>`
    : `<div class="numShow empty">키패드로 답을 입력하세요</div>`;
  const keys = ["1","2","3","4","5","6","7","8","9","0"].map(d => `<button data-action="digit" data-d="${d}">${d}</button>`).join("");
  return `<div class="numWrap">${show}<div class="numpad">${keys}<button class="fn" data-action="numclear">지움</button><button class="fn" data-action="numback">←</button></div><p class="numHint">PC에서는 키보드 숫자키로도 입력할 수 있어요.</p></div>`;
}

function viewQuiz() {
  const q = state.test[state.index];
  const sel = state.answers[state.index];
  const answered = q.input ? (sel !== undefined && sel !== "") : sel !== undefined;
  let body;
  if (q.input) {
    body = numpadHTML(sel || "");
  } else {
    const figc = typeof q.choices[0] === "object";
    const btns = [];
    for (let i = 0; i < 8; i++) {
      btns.push(`<button data-action="choose" data-i="${i}" class="${sel === i ? "selected" : ""}"><span>${String.fromCharCode(65 + i)}</span>${choiceContent(q, i, 44)}</button>`);
    }
    body = `<div class="choices c8 ${figc ? "figc" : ""}">${btns.join("")}</div>`;
  }
  return `
  <section class="quizWrap">
    <div class="quizHead"><span>${q.area} · ${setName()}</span><strong>${String(state.index + 1).padStart(2, "0")} <small>/ 27</small></strong></div>
    <div class="progress"><i style="width:${((state.index + 1) / 27) * 100}%"></i></div>
    <div class="questionCard">
      <p class="areaDesc">${AREA_DESC[q.area]}</p>
      <h2>${q.prompt}</h2>
      ${q.visual ? `<div class="visual" aria-label="${q.visual}">${q.visual}</div>` : ""}
      ${q.fig ? figHTML(q.fig) : ""}
      ${body}
    </div>
    <div class="quizNav">
      <button data-action="prev" ${state.index === 0 ? "disabled" : ""}>← 이전</button>
      ${state.index < 26
        ? `<button class="next" data-action="next" ${answered ? "" : "disabled"}>다음 문제 →</button>`
        : `<button class="next" data-action="finish" ${answered ? "" : "disabled"}>결과 보기 →</button>`}
    </div>
  </section>`;
}

function viewResult() {
  const s = getSummary();
  const areaRows = Object.keys(AREA_MAX).map(a => `
    <div class="areaRow">
      <div><strong>${a}</strong><span>${AREA_DESC[a]}</span></div>
      <div class="bar"><i style="width:${(s.areas[a] / AREA_MAX[a]) * 100}%"></i></div>
      <b>${s.areas[a]} / ${AREA_MAX[a]}</b>
    </div>`).join("");
  const reviewRows = state.test.map((q, i) => {
    const user = state.answers[i];
    const ok = isCorrect(q, user);
    let mine, right;
    if (q.input) {
      mine = (user !== undefined && user !== "") ? user : "무응답";
      right = String(q.answer);
    } else {
      mine = user !== undefined ? choiceContent(q, user, 26) : "무응답";
      right = choiceContent(q, q.answer, 26);
    }
    return `
    <div class="reviewItem">
      <p class="meta">${String(i + 1).padStart(2, "0")} · ${q.area} · <b class="${ok ? "ok" : "no"}">${ok ? "정답" : "오답"}</b></p>
      <p class="q">${q.prompt}</p>
      ${q.visual ? `<p class="reviewVisual">${q.visual}</p>` : ""}
      <p>내가 고른 답: ${mine}${ok ? "" : ` · 정답: ${right}`}</p>
      <p class="note">${q.note}</p>
    </div>`;
  }).join("");
  return `
  <section class="resultWrap">
    <div class="resultHero">
      <div>
        <span class="stepLabel">만 ${state.age}세 · ${setName()} · 연구표본 기준 참고 결과</span>
        <h2>차분하게 규칙을<br>찾아냈어요.</h2>
        <p>점수 하나보다 어떤 문제를 잘 풀었는지 함께 살펴보세요.</p>
      </div>
      <div class="scoreDial"><span>참고 추론점수</span><strong>${s.score}</strong><small>백분위 약 ${s.pct}%</small></div>
    </div>
    <div class="resultGrid">
      <div class="areas"><h3>영역별 결과</h3>${areaRows}</div>
      <aside class="rawCard"><span>원점수</span><strong>${s.raw}<small>/27</small></strong><p>플란데런 12세 중심 표본<br>평균 10.76 · 표준편차 5.11</p></aside>
    </div>
    <div class="disclaimer">
      <strong>이 점수는 어떻게 계산했나요?</strong>
      <p>2025년 Ch-ICAR 연구표본의 평균과 표준편차를 이용해 평균 100, 표준편차 15 형태로 단순 환산했습니다. 매회 문제은행에서 무작위로 출제되므로 회차·세트 간 점수를 직접 비교할 수 없고, 한국 어린이의 연령별 표준화 IQ가 아니며, 극단 점수와 개별 영역 해석에는 특히 주의해야 합니다.</p>
    </div>
    <details class="review">
      <summary>문항별 풀이 다시 보기 (27문항)</summary>
      ${reviewRows}
    </details>
    <div class="resultActions">
      <button data-action="home">처음으로</button>
      <button class="primary" data-action="setup">다시 풀기 <span>↻</span></button>
    </div>
  </section>`;
}

function render() {
  const body = state.screen === "home" ? viewHome()
    : state.screen === "setup" ? viewSetup()
    : state.screen === "quiz" ? viewQuiz()
    : viewResult();
  app.innerHTML = `
  <header class="topbar">
    <button class="brand" data-action="home"><span class="brandMark">Q</span> 생각별 IQ 연구소</button>
    <span class="researchTag">Ch-ICAR 연구 구조 기반</span>
  </header>
  ${body}
  ${foot}`;
}

function setScreen(s) { state.screen = s; render(); window.scrollTo(0, 0); }

function inputDigit(d) {
  const cur = state.answers[state.index] || "";
  if (cur.length >= 6) return;
  state.answers[state.index] = cur + d;
  render();
}
function inputBack() {
  const cur = state.answers[state.index] || "";
  state.answers[state.index] = cur.slice(0, -1);
  render();
}

app.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const a = btn.dataset.action;
  if (a === "home") setScreen("home");
  else if (a === "setup") setScreen("setup");
  else if (a === "start") { state.index = 0; state.answers = {}; state.test = drawTest(); setScreen("quiz"); }
  else if (a === "choose") { state.answers[state.index] = Number(btn.dataset.i); render(); }
  else if (a === "digit") inputDigit(btn.dataset.d);
  else if (a === "numback") inputBack();
  else if (a === "numclear") { state.answers[state.index] = ""; render(); }
  else if (a === "prev") { state.index--; render(); }
  else if (a === "next") { state.index++; render(); window.scrollTo(0, 0); }
  else if (a === "finish") setScreen("result");
});

app.addEventListener("change", e => {
  if (e.target.id === "age") { state.age = Number(e.target.value); render(); }
  else if (e.target.id === "consent") { state.consent = e.target.checked; render(); }
});

document.addEventListener("keydown", e => {
  if (state.screen !== "quiz") return;
  const q = state.test[state.index];
  if (!q || !q.input) return;
  if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
  else if (e.key === "Backspace") { e.preventDefault(); inputBack(); }
  else if (e.key === "Enter") {
    const sel = state.answers[state.index];
    if (sel !== undefined && sel !== "") {
      if (state.index < 26) { state.index++; render(); window.scrollTo(0, 0); }
      else setScreen("result");
    }
  }
});

render();
</script>

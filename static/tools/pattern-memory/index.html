<style>
:root{--ink:#18221c;--paper:#f4f1e8;--mint:#c9f36a;--orange:#ff6b35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Arial,'Malgun Gothic',sans-serif}.shell{min-height:100dvh;display:flex;flex-direction:column}header,footer{width:min(1180px,100%);margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ccd0c8}a{color:inherit}.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none}.mark{display:grid;place-items:center;width:31px;height:31px;background:var(--ink);color:var(--mint);border-radius:50%;font:bold 20px Georgia}.tag{border:1px solid;border-radius:30px;padding:6px 12px;font-size:12px}footer{border-bottom:0;border-top:1px solid #ccd0c8;font-size:12px;color:#59665b;margin-top:auto}main{width:min(1120px,100%);margin:0 auto;padding:clamp(24px,4vh,48px) 28px;flex:1}h1{font-size:clamp(36px,6vw,68px);line-height:1.08;letter-spacing:-.06em;margin:14px 0 28px}h2{line-height:1.4}h3{margin:0 0 10px}.eyebrow{font-size:12px;font-weight:bold;color:#ce481b}.hero h1{font-size:clamp(40px,min(6.5vw,10vh),86px)}em{color:var(--orange);font-family:Georgia,serif;font-weight:400}.hero{position:relative}.hero p{max-width:640px}.lead{font-size:18px;color:#435047}.facts{display:flex;gap:30px;margin:24px 0}.facts b{font:700 32px Georgia}.facts span{font-size:12px}.muted{font-size:13px;color:#59665b}.notice{font-size:12px;color:#59665b}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button,select{font:inherit}button{border:1px solid var(--ink);border-radius:3px;background:#fffdf7;color:var(--ink);padding:12px 18px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}.primary{background:var(--ink);color:white;border:0;box-shadow:5px 5px 0 var(--mint);padding:17px 22px;font-weight:bold}.wide{width:100%;text-align:left;display:flex;justify-content:space-between}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:4px}.guide{background:var(--ink);color:white;border-top:5px solid var(--mint);padding:24px}.guide p,.guide li{color:#c0c8c1;font-size:14px}.intro{display:grid;grid-template-columns:1fr 1.7fr;gap:30px;margin-top:32px}.intro h2{margin:0}.setupGrid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px}select{width:100%;padding:12px;background:#fffdf7;border:1px solid #9aa49e;margin:10px 0}.check{display:flex;gap:12px;margin:22px 0;font-size:14px}.check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--ink)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.figure{background:#fffdf7;border:1px solid #ccd0c8;text-align:center;padding:10px;min-width:0}.figure small{font-size:12px;color:#59665b}.figure svg{display:block;width:100%;height:clamp(150px,29vh,240px)}.example .figure svg{height:110px}.testhead{display:flex;justify-content:space-between;font-size:14px;gap:10px}.testhead strong{color:#ce481b}progress{width:100%;height:7px;accent-color:var(--ink)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choices button{min-height:66px;font-weight:bold}kbd{display:block;font:12px Arial;color:#59665b}.feedback{min-height:28px;text-align:center;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#fffdf7;border:1px solid #ccd0c8;padding:20px}.stat strong{font:700 42px Georgia;display:block}.stat small{display:block;color:#59665b}.panel{border-top:1px solid #bfc5c0;margin-top:28px;padding-top:16px}.warn{border-left:4px solid var(--orange);background:#fffdf7;padding:12px 16px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #ccd0c8}details{margin-top:24px}summary{cursor:pointer;font-weight:bold}@media(max-width:650px){header,footer{padding:14px 18px;flex-wrap:wrap}.tag{font-size:10px}main{padding:24px 18px}.setupGrid,.intro,.stats{grid-template-columns:1fr}.setupGrid{gap:24px}.pair{gap:10px}.figure{padding:6px}.figure svg{height:160px}.facts{gap:18px}.lead{font-size:16px}.choices{gap:10px}.choices button{padding:12px 6px}.hero h1{font-size:42px}}
@media(min-width:651px) and (max-height:800px){main{padding-top:22px;padding-bottom:22px}.hero h1{font-size:clamp(44px,8.8vh,70px);margin-bottom:18px}.hero .lead{margin:14px 0}.hero .facts{margin:16px 0}.intro{margin-top:20px;padding:18px 24px}.intro p{margin:0}.intro h2{font-size:24px}}

.board{position:relative;width:min(420px,100%);aspect-ratio:1.25;margin:14px auto;background:#e7e9df;border:1px solid #c1c9bd;border-radius:4px;touch-action:manipulation}
.block{position:absolute;width:16%;height:19%;padding:0;background:var(--ink);border:2px solid var(--ink);border-radius:3px;color:white;font-weight:bold;font-size:20px;transition:none}
.block:disabled{opacity:1;cursor:default}.block.lit{background:var(--mint);color:var(--ink);outline:4px solid var(--orange);outline-offset:2px}.block.picked{background:#3f5142}
.entry{display:flex;justify-content:center;gap:7px;min-height:24px;margin:10px 0}.entry span{width:12px;height:12px;border:1px solid var(--ink);border-radius:50%;margin-top:4px}.entry .filled{background:var(--ink)}
.task{max-width:760px;margin:auto}.task h1{font-size:clamp(25px,4vw,36px);margin:10px 0}.task .actions{justify-content:center;margin-top:14px}.status{text-align:center;min-height:28px;font-weight:bold}
.explain{background:#fffdf7;border-left:4px solid var(--mint);padding:18px 22px;margin:20px 0}.explain p{margin:6px 0}
.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.summaryGrid .stat strong{font-size:42px}.lengthTable caption{text-align:left;font-weight:bold;margin:18px 0 5px}
@media(max-width:650px){.summaryGrid{grid-template-columns:1fr}.block{min-height:44px}.task .actions{gap:8px}.task .actions button{padding:10px 12px}.board{margin:12px auto}.status{font-size:14px}}
@media(min-width:651px) and (max-height:720px){header,footer{padding-top:12px;padding-bottom:12px}main{padding-top:12px;padding-bottom:12px}.hero h1{font-size:54px;margin:10px 0 14px}.hero .lead{margin:10px 0}.hero .facts{margin:12px 0}.intro{margin-top:16px;padding:14px 24px}.board{width:270px}.task .muted{margin:6px 0}.task .actions{margin-top:10px}.task h1{font-size:28px;margin:8px 0}.status{margin:8px 0}}
 .feedbackCard{text-align:center;padding:32px 18px;margin:20px 0;background:#fffdf7;border-top:4px solid var(--mint)}.feedbackCard.miss{border-color:var(--orange)}.feedbackIcon{font:54px Georgia;color:#456518}.miss .feedbackIcon{color:var(--orange)}.reviewPair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.reviewBoard{position:relative;aspect-ratio:1.25;background:#e7e9df;margin:8px 0}.reviewBlock{position:absolute;width:16%;height:19%;display:grid;place-items:center;background:var(--ink);color:white;font-size:14px}.reviewBlock.wrong{background:#b23b12}.tap{animation:tap .18s ease-out}@keyframes tap{50%{transform:scale(.9);background:var(--mint);color:var(--ink)}}@media(prefers-reduced-motion:reduce){.tap{animation:none}}@media(max-width:650px){.reviewPair{gap:8px}.reviewBlock{font-size:11px}.feedbackCard{padding:18px 10px}}

/* The memory surface uses the same paper, ink and lime as the lab. */
.task:has(.board){max-width:680px}
.task:has(.board) .testhead{border-bottom:1px solid #ccd0c8;padding-bottom:12px}
.task:has(.board) h1{text-align:center;margin:20px 0 8px}
.task:has(.board) .status{font-size:13px;font-weight:500;color:#566252;margin:0 0 18px}
.board{width:min(440px,100%);aspect-ratio:1.25;margin:0 auto;border:1px solid #d6d9cd;border-radius:20px;background:#eceee4;box-shadow:inset 0 2px 10px #18221c08,0 8px 0 #dfe3d5}
.block{width:16%;height:20%;border:1px solid #435043;border-bottom:4px solid #101b13;border-radius:12px;background:#26382b;box-shadow:0 4px 0 #18221c12;color:#fffdf7;font-size:18px}
.block.lit{background:var(--mint);border-color:#a5ca51;border-bottom-color:#8eb23b;outline:0;box-shadow:0 0 0 4px #c9f36a33,0 4px 0 #92b73e;color:var(--ink)}
.block.picked{background:#e3f3c3;border-color:#9cac89;border-bottom-color:#839970;color:var(--ink)}

.task:has(.board) .actions{gap:8px;margin-top:12px}
.task:has(.board) .actions button{font-size:13px;padding:10px 16px}
.task:has(.board) .actions:last-child{margin-top:8px}
.task:has(.board) .actions:last-child button{border:0;background:none;color:#66715f;padding:7px 12px;text-decoration:underline;text-underline-offset:4px}
.task:has(.board) .muted{font-size:11px;margin:12px 0 0}

@media(min-width:651px) and (max-height:720px){
.task:has(.board) h1{font-size:28px;margin:12px 0 6px}

.board{width:340px}.entry{margin-top:18px}
}

.task:has(.board) h1{font-size:26px;letter-spacing:-.05em;margin-top:20px}

</style></head><body><div class="shell"><header><a class="brand" href="/lab/"><span class="mark">M</span>생각별 연구소</a><span class="tag">패턴 기억 · 시공간 기억</span></header><main id="app"></main><footer><a href="/lab/">← 생각별 연구소</a><span>교육용 참고 과제 · 한국어 전용</span><a href="/">블로그</a></footer></div><noscript>검사를 진행하려면 JavaScript가 필요합니다.</noscript>
<script>
'use strict';
const VERSION='pattern-memory-ko-v2',START=2,MAX=9,SHOW=700,GAP=300,RESPONSE=30000;
const POS=[[8,8],[39,3],[72,13],[4,40],[36,34],[73,46],[13,73],[46,70],[77,78]];
const app=document.getElementById('app');
let state={screen:'home',mode:'idle',direction:'forward',practice:true,length:2,attempt:0,practiceIndex:0,records:[],practiceRecords:[],entry:[],seq:[],interruptions:0,voided:[],input:'mouse',ended:{}};
let timers=[],generation=0,raf=0,responseStart=0,autoTimer=0;
const label=d=>d==='forward'?'정방향':'역방향';
function stop(){timers.forEach(clearTimeout);timers=[];clearTimeout(autoTimer);autoTimer=0;cancelAnimationFrame(raf);generation++}
function later(fn,ms){const token=generation;timers.push(setTimeout(()=>{if(token===generation)fn()},ms))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sequence(n,previous=[]){let a;do{a=shuffle([...Array(9).keys()]).slice(0,n)}while(a.join()===previous.join());return a}
function expected(){return state.direction==='forward'?[...state.seq]:[...state.seq].reverse()}
function board(){return '<div class="board" aria-label="기억할 위치 9개">'+POS.map((p,i)=>'<button class="block" data-cell="'+i+'" aria-label="위치 '+(i+1)+'" style="left:'+p[0]+'%;top:'+p[1]+'%" disabled tabindex="-1"></button>').join('')+'</div>'}
function action(id,text,primary=false){return '<button data-action="'+id+'" class="'+(primary?'primary':'')+'">'+text+'</button>'}
function home(){stop();state.screen='home';state.mode='idle';app.innerHTML='<section class="hero"><div class="eyebrow">● 패턴 기억 테스트</div><h1>방금 켜진 칸,<br><em>몇 개까지</em> 기억할까요?</h1><p class="lead">칸이 하나씩 켜져요. 잘 봐두었다가 같은 순서로 눌러보세요. 뒤에서는 거꾸로 기억해볼 거예요.</p><div class="facts"><span><b>9</b>개 위치</span><span><b>2</b>가지 방향</span><span><b>5–8</b>분 내외</span></div><button class="primary wide" data-action="setup">테스트 시작하기 <span>→</span></button><p class="notice">자체 제작 교육용 과제입니다. 전문 검사나 진단을 대신하지 않으며 응답은 서버로 전송하지 않습니다. 진행에 따라 소요시간은 달라집니다.</p></section><section class="guide intro"><h2>먼저 순서대로,<br>그다음엔 거꾸로.</h2><p>처음에는 본 순서대로 누르고, 다음에는 마지막 칸부터 거꾸로 눌러요. 끝나면 각각 몇 개까지 기억했는지 볼 수 있어요.</p></section>'}
function setup(){stop();state.screen='setup';state.mode='idle';app.innerHTML='<div class="eyebrow">이렇게 해보세요</div><h1>켜진 칸을<br>따라 눌러보세요.</h1><div class="setupGrid"><div><label for="input"><b>응답 방식</b></label><select id="input"><option value="mouse">마우스 · 위치 클릭</option><option value="touch">터치 · 위치 누르기</option></select><div class="explain"><h3>정방향과 역방향</h3><p>왼쪽 → 위쪽 → 오른쪽 순서로 켜졌다면</p><p><b>정방향:</b> 왼쪽 → 위쪽 → 오른쪽</p><p><b>역방향:</b> 오른쪽 → 위쪽 → 왼쪽</p></div><p class="muted">각 방향은 한 번 연습하고 시작해요. 틀리면 한 번 더 연습합니다. 2개부터 늘어나고, 같은 길이에서 두 번 모두 틀리면 그 방향을 마쳐요.</p><label class="check"><input id="consent" type="checkbox"><span>화면의 위치 변화를 구별할 수 있고, 결과가 교육용 참고 기록임을 이해했습니다.</span></label><button id="start" class="primary wide" data-action="start" disabled>한 번 해보기 →</button></div><aside class="guide"><h2>눈으로 기억한 뒤 답하세요</h2><ul><li>보여주는 동안에는 누를 수 없습니다.</li><li>입력 안내가 나오면 순서대로 누르세요.</li><li>잘못 눌렀다면 자동 제출 전에 한 칸 지우기를 누르세요.</li><li>마지막 칸을 누르면 1.2초 후 자동으로 답을 확인해요.</li><li>입력 제한시간은 30초이며 속도는 점수가 아닙니다.</li></ul><p>메모하거나 화면을 촬영하지 말고 기억으로 답하세요. 탭이나 창을 벗어나면 해당 시행을 취소하고 새 순서로 다시 진행합니다.</p></aside></div>';document.getElementById('input').value=matchMedia('(pointer:coarse)').matches?'touch':'mouse';document.getElementById('consent').onchange=e=>document.getElementById('start').disabled=!e.target.checked}
function start(){state={...state,input:document.getElementById('input').value,records:[],practiceRecords:[],interruptions:0,voided:[],ended:{}};begin('forward',true)}
function begin(direction,practice){stop();state.direction=direction;state.practice=practice;state.length=START;state.attempt=0;state.practiceIndex=0;trial()}
function trial(){stop();state.screen='test';state.mode='show';state.entry=[];state.seq=sequence(state.length,state.seq);app.innerHTML='<div class="task"><div class="testhead"><strong>'+label(state.direction)+' · '+(state.practice?'연습'+(state.practiceIndex?' · 한 번 더':''):'본검사 · '+state.length+'개 · '+(state.attempt+1)+'/2회')+'</strong><span>위치와 순서</span></div><h1>'+ (state.direction==='forward'?'어디가 켜지는지 보세요.':'이번엔 거꾸로 기억해보세요.')+'</h1><p class="status" id="status" aria-live="polite">곧 켜져요. 눈으로만 봐주세요.</p>'+board()+'<div id="entry" class="entry" aria-label="입력 진행"></div><div class="actions"><button data-action="undo" id="undo" disabled>한 칸 지우기</button><button data-action="clear" id="clear" disabled>다시 입력</button><button data-action="submit" id="submit" class="primary" disabled>바로 확인</button></div><p class="muted" style="text-align:center">마지막 칸을 누르면 자동 제출 · 수정은 한 칸 지우기</p><div class="actions">'+action('pause','잠깐 쉬기')+'</div></div>';updateEntry();later(()=>showAt(0),600)}
function showAt(i){if(i===state.seq.length){response();return}const b=app.querySelector('[data-cell="'+state.seq[i]+'"]');const token=generation;raf=requestAnimationFrame(()=>{if(token!==generation)return;b.classList.add('lit');b.textContent='●';document.getElementById('status').textContent='잘 봐두세요 · '+(i+1)+' / '+state.length;later(()=>{b.classList.remove('lit');b.textContent='';later(()=>showAt(i+1),GAP)},SHOW)})}
function response(){state.mode='input';responseStart=performance.now();app.querySelector('h1').textContent=state.direction==='forward'?'이제 순서대로 눌러보세요.':'이제 거꾸로 눌러보세요.';document.getElementById('status').textContent=(state.direction==='forward'?'본 순서대로':'마지막 위치부터 거꾸로')+' 누르세요 · 입력 30초';app.querySelectorAll('[data-cell]').forEach(b=>b.disabled=false);later(()=>submit(true),RESPONSE)}
function updateEntry(){const el=document.getElementById('entry');if(!el)return;el.innerHTML=Array.from({length:state.length},(_,i)=>'<span class="'+(i<state.entry.length?'filled':'')+'"></span>').join('');el.setAttribute('aria-label',state.length+'개 중 '+state.entry.length+'개 입력');for(const id of ['undo','clear'])document.getElementById(id).disabled=state.mode!=='input'||!state.entry.length;document.getElementById('submit').disabled=state.mode!=='input'||state.entry.length!==state.length;app.querySelectorAll('[data-cell]').forEach(b=>{b.classList.toggle('picked',state.entry.includes(Number(b.dataset.cell)));b.textContent=state.entry.map((x,i)=>x===Number(b.dataset.cell)?i+1:null).filter(x=>x!==null).join('·')})}
function pick(i){if(state.mode!=='input'||state.entry.length>=state.length)return;state.entry.push(i);updateEntry();const cell=app.querySelector('[data-cell="'+i+'"]');cell.classList.remove('tap');void cell.offsetWidth;cell.classList.add('tap');if(state.entry.length===state.length){document.getElementById('status').textContent='다 눌렀어요. 잠시 후 답을 확인할게요.';clearTimeout(autoTimer);autoTimer=setTimeout(()=>submit(),1200)}}
function submit(timeout=false){if(state.mode!=='input'||(!timeout&&state.entry.length!==state.length))return;const elapsed=performance.now()-responseStart;timeout=timeout||elapsed>=RESPONSE;stop();state.mode='feedback';const correct=!timeout&&state.entry.join()===expected().join();const record={direction:state.direction,length:state.length,attempt:state.practice?state.practiceIndex+1:state.attempt+1,sequence:[...state.seq],expected:expected(),response:[...state.entry],correct,status:timeout?'timeout':correct?'correct':'wrong',responseMs:Math.round(elapsed)};(state.practice?state.practiceRecords:state.records).push(record);state.lastCorrect=correct;app.innerHTML='<div class="task"><div class="testhead"><strong>'+label(state.direction)+' · '+state.length+'개</strong><span>'+(state.practice?'연습':'기억 확인')+'</span></div><div class="feedbackCard '+(correct?'success':'miss')+'"><div class="feedbackIcon">'+(correct?'✓':'↶')+'</div><h1>'+(timeout?'시간이 다 됐어요.':correct?'맞았어요!':'아깝네요. 순서가 달랐어요.')+'</h1><p>'+(state.practice?(correct?'연습 끝! 이제 2개부터 시작해요.':'켜진 위치를 '+(state.direction==='forward'?'그 순서대로':'마지막부터 거꾸로')+' 눌러보세요.'):(correct?state.length+'개를 순서대로 기억했어요.':'틀린 순서는 아래에서 비교할 수 있어요.'))+'</p><p class="muted" id="autoHint">잠시 후 자동으로 넘어갑니다.</p></div><div id="review"></div><div class="actions">'+(!correct?action('review','내 답과 비교하기'):'')+action('pause','잠깐 쉬기')+'</div></div>';later(next,correct?1400:2800)}
function next(){if(state.mode!=='feedback')return;stop();if(state.practice){state.practiceIndex++;if(state.lastCorrect){begin(state.direction,false);return}if(state.practiceIndex<2){trial();return}intro(state.direction,false);return}state.attempt++;if(state.attempt<2){trial();return}const pass=state.records.some(r=>r.direction===state.direction&&r.length===state.length&&r.correct);if(pass&&state.length<MAX){state.length++;state.attempt=0;trial();return}state.ended[state.direction]=pass?'ceiling':'two-fails';if(state.direction==='forward')intro('backward',true);else results()}
function intro(direction,practice){stop();state.screen='intro';state.mode='idle';state.nextDirection=direction;state.nextPractice=practice;app.innerHTML='<div class="eyebrow">'+(practice?'이제 반대로':'연습을 마쳤어요')+'</div><h1>'+(practice?'이번에는<br>거꾸로 눌러보세요.':'한 번 더 연습할까요?')+'</h1><p class="lead">'+(direction==='backward'?'마지막에 켜진 칸부터 첫 번째 칸까지, 순서를 거꾸로 따라가면 돼요.':'처음 켜진 칸부터 차례로 누르면 돼요.')+'</p><p>'+(practice?'짧게 한 번 연습하고 시작할게요.':'연습 점수는 결과에 들어가지 않아요. 방법이 익숙해졌다면 바로 시작해도 돼요.')+'</p><div class="actions">'+action('continue',practice?'거꾸로 연습하기 →':'본검사 시작 →',true)+(practice?'':action('repeat','다시 연습하기'))+'</div>'}
function pause(){if(state.screen!=='test'||!['show','input','feedback'].includes(state.mode))return;const answered=state.mode==='feedback';if(!answered)state.voided.push({direction:state.direction,practice:state.practice,length:state.length,stage:state.mode,sequence:[...state.seq]});stop();state.mode=answered?'pausedFeedback':'paused';state.interruptions++;app.innerHTML='<div class="eyebrow">잠깐 쉬는 중</div><h1>준비되면 이어가세요.</h1><p>'+(answered?'방금 답은 저장했어요. 다음 순서부터 이어갑니다.':'보던 순서는 점수에 넣지 않았어요. 같은 길이의 새 순서로 다시 시작합니다.')+'</p><div class="actions">'+action('resume','이어 하기 →',true)+action('home','그만하기')+'</div>'}

function cancelAuto(){clearTimeout(autoTimer);autoTimer=0;document.getElementById('status').textContent=(state.direction==='forward'?'본 순서대로':'마지막부터 거꾸로')+' 눌러보세요.'}
function review(){if(state.mode!=='feedback')return;stop();document.getElementById('autoHint').textContent='비교가 끝나면 계속하기를 누르세요.';const expectedSeq=expected();function marked(seq,title){return '<section><h3>'+title+'</h3><div class="reviewBoard">'+POS.map((p,id)=>{const labels=seq.map((x,i)=>x===id?i+1:null).filter(x=>x!==null);const wrong=seq.some((x,i)=>x===id&&x!==expectedSeq[i]);return '<div class="reviewBlock '+(wrong?'wrong':'')+'" style="left:'+p[0]+'%;top:'+p[1]+'%">'+labels.join('·')+'</div>'}).join('')+'</div></section>'}document.getElementById('review').innerHTML='<p>칸 안의 숫자는 누르는 순서예요. 주황색은 정답과 순서가 다른 위치입니다.</p><div class="reviewPair">'+marked(expectedSeq,'정답 순서')+marked(state.entry,'내가 누른 순서')+'</div><div class="actions">'+action('next','계속하기 →',true)+'</div>';const b=app.querySelector('[data-action="review"]');if(b)b.disabled=true}

function summary(direction){const a=state.records.filter(r=>r.direction===direction),correct=a.filter(r=>r.correct),span=correct.length?Math.max(...correct.map(r=>r.length)):null;return {direction,span,correct:correct.length,n:a.length,accuracy:a.length?100*correct.length/a.length:null,ceiling:state.ended[direction]==='ceiling',lengths:[...new Set(a.map(r=>r.length))].map(length=>({length,correct:a.filter(r=>r.length===length&&r.correct).length,n:a.filter(r=>r.length===length).length}))}}
function getResult(){return {tool:'pattern-memory',protocolVersion:VERSION,language:'ko',inputMode:state.input,layout:POS,settings:{start:START,max:MAX,trialsPerLength:2,showMs:SHOW,gapMs:GAP,responseLimitMs:RESPONSE,autoSubmitMs:1200,practicePolicy:'one-correct-or-two-attempts',feedback:'auto-advance-with-optional-review'},completed:Boolean(state.ended.forward&&state.ended.backward),interruptions:state.interruptions,voided:state.voided,summary:{forward:summary('forward'),backward:summary('backward')},trials:state.records.map(r=>({...r})),practiceTrials:state.practiceRecords.map(r=>({...r}))}}
function results(){stop();state.screen='result';state.mode='idle';const f=summary('forward'),b=summary('backward');app.innerHTML='<div class="eyebrow">패턴 기억 · 내 기록</div><h1>이번에는<br>여기까지 기억했어요.</h1><div class="summaryGrid">'+[f,b].map(s=>'<div class="stat">'+(s.direction==='forward'?'순서대로':'거꾸로')+' 기억한 길이<strong>'+(s.span===null?'미확인':s.span+'개')+'</strong><small>'+(s.span===null?'시작 길이 2개에서 정답이 없었습니다.':s.ceiling?'최대 제시 길이 도달 · 실제 한계는 더 높을 수 있습니다.':'해당 길이에서 1회 이상 순서 전체 정답')+'</small><p>정답 '+s.correct+' / '+s.n+'회 · 정확도 '+Math.round(s.accuracy)+'%</p></div>').join('')+'</div><details><summary>길이별 기록 보기</summary><div class="tablewrap"><table class="lengthTable"><caption>길이별 정답 / 시도</caption><thead><tr><th>위치 수</th><th>정방향</th><th>역방향</th></tr></thead><tbody>'+Array.from({length:8},(_,i)=>i+2).filter(n=>[f,b].some(s=>s.lengths.some(x=>x.length===n))).map(n=>'<tr><td>'+n+'개</td>'+[f,b].map(s=>{const r=s.lengths.find(x=>x.length===n);return '<td>'+(r?r.correct+' / '+r.n:'미실시')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div></details><details class="panel"><summary>이 기록은 어떻게 보면 될까요?</summary><h2>위치와 순서를 얼마나 기억했나요?</h2><p>방금 한 일은 <b>잠깐 본 위치와 순서를 기억하는 것</b>이에요. 이를 시공간 기억이라고 합니다. 거꾸로 누를 때는 기억한 순서를 뒤집는 과정도 필요해요. 숫자 폭 테스트에서 숫자의 순서를 기억했다면, 여기서는 칸의 위치를 기억한 셈이에요.</p><h3>기억한 개수와 정답 기록을 함께 보세요.</h3><p>최대 기억 길이는 이번 검사에서 순서 전체를 맞힌 가장 긴 길이입니다. 한 번 맞혔다고 그 길이를 항상 기억한다는 뜻은 아니므로 길이별 2회 기록도 함께 보세요.</p><p>길이가 늘어나는 방식이라 사람마다 풀게 되는 문항이 다릅니다. 정확도가 높다는 이유만으로 다른 사람보다 기억력이 좋다고 비교할 수 없습니다. 두 방향의 길이를 합쳐 IQ나 단일 능력 점수로 만들지 않았습니다.</p><p>역방향이 짧아도 곧바로 문제가 있다는 뜻은 아니며 더 길다고 더 우수하다고 단정할 수도 없습니다. 제시 순서·연습·집중 상태와 전략이 영향을 줄 수 있습니다. 길 찾기나 일상 기억력 전체를 평가한 것은 아닙니다.</p><p>자체 배치·속도·중단 규칙을 사용하는 교육용 과제이며 이 버전에 맞는 연령별 규준은 없습니다. 낮은 기록을 지능 저하나 질환의 신호로 해석하지 마세요. 반복 비교는 같은 기기와 입력 방식으로 하되 연습 효과도 고려하세요.</p></details><p class="muted">검사 중단 '+state.interruptions+'회 · 본검사 시간 초과 '+state.records.filter(r=>r.status==='timeout').length+'회. 중단된 시행은 점수에서 제외하고 새 순서로 대체했습니다.</p><details><summary>측정 방법과 참고 자료</summary><p>9개 위치의 고정된 자체 배치. 각 순서 안에서는 위치를 중복하지 않습니다. 한 칸 700ms 표시·300ms 간격, 길이당 2회 중 1회 이상 정답이면 다음 길이, 2회 실패하면 해당 방향 종료. 최대 9개입니다. 입력 30초 제한은 운영 기준이며 입력 속도를 점수로 사용하지 않습니다.</p><p>기억 길이는 최소 2개부터 관찰합니다. 시작 길이 실패는 0개를 기억한다는 뜻이 아니며 미확인으로 표시합니다. 9개 성공은 검사 상한 도달로 표시합니다.</p><p><a href="https://www.psytoolkit.org/experiment-library/corsi.html" target="_blank" rel="noopener">참고한 Corsi 과제 설명</a>. 원검사의 배치·문항·코드를 복제하지 않았으며, 이 웹 버전은 원검사와 동일하거나 표준화된 검사가 아닙니다.</p><p>프로토콜 '+VERSION+'. 응답은 서버로 전송하지 않습니다. 기록 다운로드는 기기에만 저장되며 버전·입력 방식·자극·응답·중단 정보를 포함합니다.</p></details><div class="actions">'+action('home','처음으로',true)+action('download','내 기록 내려받기 (JSON)')+'</div>'}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='home')home();if(a==='setup')setup();if(a==='start'&&document.getElementById('consent').checked)start();if(a==='continue')begin(state.nextDirection,state.nextPractice);if(a==='repeat')begin(state.nextDirection,true);if(a==='pause')pause();if(a==='resume'&&state.mode==='paused')trial();if(a==='resume'&&state.mode==='pausedFeedback'){state.mode='feedback';next()}if(a==='review')review();if(a==='next')next();if(a==='undo'&&state.mode==='input'){state.entry.pop();cancelAuto();updateEntry()}if(a==='clear'&&state.mode==='input'){state.entry=[];cancelAuto();updateEntry()}if(a==='submit')submit();if(a==='download'){const u=URL.createObjectURL(new Blob([JSON.stringify(getResult(),null,2)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='pattern-memory-result.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});
app.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-cell]');if(!b||b.disabled||!e.isPrimary||e.button!==0||e.pointerType!==state.input)return;e.preventDefault();pick(Number(b.dataset.cell))});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);home();
</script></body></html>

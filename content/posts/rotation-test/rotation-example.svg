<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">공간 회전 예제 문제</title>
  <desc id="desc">왼쪽 기준 도형과 오른쪽 비교 도형. 기준 도형은 오른쪽 가지가 길고 왼쪽 가지가 짧은 비대칭 T 모양이다. 비교 도형은 같은 도형을 시계 방향으로 60도 회전한 모습이다.</desc>
  <rect width="720" height="280" rx="6" fill="#f4f1e8"/>
  <rect x="16" y="16" width="336" height="248" rx="3" fill="#fffdf7" stroke="#ccd0c8"/>
  <rect x="368" y="16" width="336" height="248" rx="3" fill="#fffdf7" stroke="#ccd0c8"/>
  <g fill="#59665b" font-family="Arial, Malgun Gothic, sans-serif" font-size="18" text-anchor="middle">
    <text x="184" y="51">기준 도형</text><text x="536" y="51">비교 도형</text>
  </g>
  <g transform="translate(164 166) scale(1.7)" fill="#18221c">
    <rect x="-6.5" y="-6.5" width="56.5" height="13"/>
    <rect x="-6.5" y="-32" width="13" height="38.5"/>
    <rect x="-20" y="-6.5" width="26.5" height="13"/>
  </g>
  <g transform="translate(516 150) scale(1.7) rotate(60)" fill="#18221c">
    <rect x="-6.5" y="-6.5" width="56.5" height="13"/>
    <rect x="-6.5" y="-32" width="13" height="38.5"/>
    <rect x="-20" y="-6.5" width="26.5" height="13"/>
  </g>
</svg>

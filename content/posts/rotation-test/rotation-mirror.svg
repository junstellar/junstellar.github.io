<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">거울상은 회전해도 겹치지 않습니다</title>
<desc id="desc">위에는 기준 도형과 거울상을 시계 방향으로 60도 회전한 비교 도형이 있습니다. 아래는 비교 도형을 반시계 방향으로 60도 되돌려 겹친 결과입니다. 위쪽 가지를 맞추면 긴 가로 가지가 서로 반대쪽에 남습니다.</desc>
<defs><path id="shape" d="M-20 -6.5 H-6.5 V-32 H6.5 V-6.5 H50 V6.5 H-20 Z"/></defs>
<rect width="640" height="500" rx="8" fill="#f4f1e8"/>
<g fill="#fffdf7" stroke="#ccd0c8"><rect x="16" y="16" width="296" height="192" rx="4"/><rect x="328" y="16" width="296" height="192" rx="4"/><rect x="16" y="272" width="608" height="210" rx="4"/></g>
<g font-family="Arial, Malgun Gothic, sans-serif" text-anchor="middle" fill="#18221c">
<text x="164" y="51" font-size="23">기준 도형</text><text x="476" y="51" font-size="23">비교 도형</text>
<text x="320" y="245" font-size="22">비교 도형을 ↶ 60° 되돌려 겹치기</text>
<text x="320" y="306" font-size="23" font-weight="bold">거울상 · 양쪽 끝이 어긋납니다</text>
<text x="320" y="457" font-size="19">점선 윤곽 = 기준　 /　 주황 = 비교 도형</text>
</g>
<use href="#shape" transform="translate(144 140) scale(1.3)" fill="#18221c"/>
<use href="#shape" transform="translate(468 140) scale(1.3) rotate(60) scale(-1 1)" fill="#ff6b35"/>
<g transform="translate(300 385) scale(2)">
<use href="#shape" fill="#18221c" opacity=".12"/>
<use href="#shape" transform="scale(-1 1)" fill="#ff6b35" opacity=".7"/>
<use href="#shape" fill="none" stroke="#18221c" stroke-width="1.6" stroke-dasharray="3 2"/>
</g>
<g fill="none" stroke="#a13b16" stroke-width="2"><ellipse cx="230" cy="385" rx="38" ry="22"/><ellipse cx="370" cy="385" rx="38" ry="22"/></g>
</svg>

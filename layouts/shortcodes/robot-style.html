<style>
.article-content:has(.rb){container-type:inline-size}
.rb{--rb-bg:#f1f6f8;--rb-paper:#fff;--rb-ink:#183347;--rb-muted:#526976;--rb-line:#c9d9e1;--rb-blue:#235cce;--rb-teal:#087f83;--rb-orange:#b84a26;color:var(--rb-ink);background:var(--rb-bg);border:1px solid var(--rb-line);border-radius:12px;padding:28px;margin:30px 0;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
[data-scheme=dark] .rb{--rb-bg:#1c2d38;--rb-paper:#263c49;--rb-ink:#edf4f7;--rb-muted:#b6cbd4;--rb-line:#496572;--rb-blue:#a0bdff;--rb-teal:#79d8d4;--rb-orange:#ffb396}
.rb *{box-sizing:border-box}.rb p{margin:0}.rb .rb-kicker{font-size:13px;letter-spacing:.08em;font-weight:700;color:var(--rb-teal);margin-bottom:12px}.rb .rb-heading{font-size:26px;font-weight:750;letter-spacing:-.04em;line-height:1.4;margin:0 0 20px}.rb .rb-note{font-size:14px;color:var(--rb-muted);margin-top:18px}.rb .rb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.rb .rb-cell{min-width:0;background:var(--rb-paper);border:1px solid var(--rb-line);border-radius:7px;padding:20px}.rb .rb-cell b{display:block;font-size:19px;margin-bottom:8px}.rb .rb-cell p{font-size:16px}.rb .rb-num{font-size:32px;font-weight:750;color:var(--rb-blue);line-height:1.3}.rb .rb-muted{color:var(--rb-muted)}
.rb .rb-flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rb .rb-flow li{margin:0;padding:17px 12px;background:var(--rb-paper);border-top:3px solid var(--rb-blue);min-width:0;position:relative;font-size:15px}.rb .rb-flow li:not(:last-child)::after{content:'→';position:absolute;right:-13px;top:18px;color:var(--rb-blue);font-size:19px;z-index:1}.rb .rb-flow b{display:block;font-size:19px;margin:4px 0 10px}.rb .rb-flow span{font-size:13px;color:var(--rb-blue)}.rb .rb-return{padding:12px 16px;border:1px dashed var(--rb-teal);color:var(--rb-teal);margin-top:18px;border-radius:6px;font-size:15px}
.rb .rb-layer{display:grid;grid-template-columns:90px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--rb-line)}.rb .rb-layer:first-of-type{border-top:0}.rb .rb-layer strong{font-size:21px;color:var(--rb-blue)}.rb .rb-layer b{display:block;font-size:18px;margin-bottom:5px}.rb .rb-layer p{font-size:16px}.rb .rb-pill{display:inline-block;margin-top:10px;font-size:14px;border:1px solid var(--rb-line);border-radius:20px;padding:2px 10px;color:var(--rb-muted)}
.rb .rb-chain{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}.rb .rb-chain b{padding:8px 12px;background:var(--rb-paper);border:1px solid var(--rb-line);border-radius:5px;font-size:16px}.rb .rb-arrow{color:var(--rb-teal)}.rb .rb-callout{border-left:4px solid var(--rb-orange);padding:12px 18px;background:var(--rb-paper);margin-top:18px;font-size:16px}.rb .rb-sketch{display:block;width:100%;height:auto;max-height:240px;margin:8px auto 20px;color:var(--rb-ink)}.rb .rb-sketch text{font-family:system-ui,'Malgun Gothic',sans-serif;fill:currentColor}
.rb .rb-ledger{margin-top:16px}.rb .rb-row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid var(--rb-line);font-size:16px}.rb .rb-row b{white-space:nowrap;font-variant-numeric:tabular-nums}.rb .rb-total{color:var(--rb-blue);border-top:2px solid var(--rb-blue);border-bottom:0;font-size:20px;margin-top:10px}.rb .rb-link{display:block;padding:16px 0;border-bottom:1px solid var(--rb-line);text-decoration:none!important;box-shadow:none!important}.rb .rb-link span{display:block;font-size:14px;color:var(--rb-muted);margin-top:4px}.rb a:focus-visible,.rb button:focus-visible,.rb input:focus-visible{outline:3px solid var(--rb-orange);outline-offset:4px}
.rb-media{margin:28px 0}.rb-media figcaption{font-size:14px;line-height:1.7;margin-top:10px;color:var(--card-text-color-secondary)}.rb-cover-note{font-size:13px!important;color:var(--card-text-color-secondary);margin:0 0 24px!important}.rb-nav{font-size:15px;padding:20px 0;border-top:1px solid var(--card-separator-color);border-bottom:1px solid var(--card-separator-color);margin:30px 0}.rb-nav summary{cursor:pointer;font-weight:650}.rb-nav ol{margin-bottom:0}.rb-nav li{padding:3px 0}.rb-nav a[aria-current=page]{font-weight:750}
.rb .rb-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0}.rb label{display:block;font-size:15px}.rb input{display:block;width:100%;min-width:0;background:var(--rb-paper);color:var(--rb-ink);border:1px solid var(--rb-line);border-radius:5px;font:inherit;font-size:20px;padding:10px;margin-top:6px}.rb .rb-output{background:var(--rb-paper);border-left:4px solid var(--rb-teal);padding:18px;margin-top:18px}.rb .rb-output strong{font-size:30px;color:var(--rb-blue)}.rb .rb-table-wrap{overflow-x:auto}.rb table{margin:12px 0;font-size:15px;width:100%;background:transparent}.rb th,.rb td{padding:13px 10px!important;border-color:var(--rb-line)!important;vertical-align:top}.rb th{color:var(--rb-ink);background:var(--rb-paper)}
@media(max-width:620px){.rb{padding:20px 16px}.rb .rb-heading{font-size:23px}.rb .rb-grid,.rb .rb-controls{grid-template-columns:1fr}.rb .rb-flow{grid-template-columns:1fr}.rb .rb-flow li{padding:14px 17px}.rb .rb-flow li:not(:last-child)::after{content:'↓';top:auto;bottom:-21px;right:20px}.rb .rb-flow b{display:inline;margin-right:10px}.rb .rb-flow span{margin-right:8px}.rb .rb-layer{grid-template-columns:1fr;gap:5px}.rb .rb-chain{gap:8px}.rb .rb-row{font-size:15px}.rb .rb-total{font-size:18px}}
@container(max-width:620px){.rb{padding:20px 16px}.rb .rb-heading{font-size:23px}.rb .rb-grid,.rb .rb-controls{grid-template-columns:1fr}.rb .rb-flow{grid-template-columns:1fr}.rb .rb-flow li{padding:14px 17px}.rb .rb-flow li:not(:last-child)::after{content:'↓';top:auto;bottom:-21px;right:20px}.rb .rb-flow b{display:inline;margin-right:10px}.rb .rb-flow span{margin-right:8px}.rb .rb-layer{grid-template-columns:1fr;gap:5px}}
.rb-media .rb-video-link{display:block;position:relative;overflow:hidden;border-radius:10px;background:#183347;box-shadow:none!important;text-decoration:none;color:white!important}.rb-media .rb-video-link img{display:block;width:100%;height:auto;margin:0;aspect-ratio:16/9;object-fit:cover;opacity:.95}.rb-media .rb-video-link>span{position:absolute;bottom:18px;left:18px;background:#153548;padding:12px 18px;border-radius:7px;font-size:17px;font-weight:700;box-shadow:0 2px 8px #0003}.rb-media .rb-video-link small{display:block;font-size:12px;font-weight:400;margin-top:4px;color:#d8e7ef}.rb-media .rb-video-link:focus-visible{outline:3px solid #b84a26;outline-offset:4px}
.rb .table-wrapper{width:100%;margin:0;padding:0;max-width:100%}.rb .rb-table-wrap{margin:0}.rb .rb-table-wrap table{table-layout:fixed}.rb .rb-table-wrap th:first-child{width:25%}
</style>
